<script>
(() => {
  /* ---- Bron van artikeldata ----
     De app leest alleen feed.json (gemaakt door de pipeline). Komen artikelen later
     uit een GitHub-repository, dan maakt de pipeline nog steeds dit bestand en
     verandert hier niets. */
  const FEED_URL = "feed.json";
  const SUPPORTED_SCHEMA = 1;

  const state = { feed: null, view: "actueel", ddTab: "alle", ddById: new Map(), group: "all", period: "all", sort: "date", q: "", byId: new Map(), scrollY: 0 };
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("radar:" + k); return v ?? d; } catch { return d; } },
    set(k, v) {
      try { localStorage.setItem("radar:" + k, v); } catch {}
      // Tabblad en subtab ook per sessie: verversen houdt je waar je was, de app opnieuw openen begint bij Actueel
      if (["view", "sort", "ddTab"].includes(k)) { try { sessionStorage.setItem("radar:" + k, v); } catch {} }
    },
    session(k) { try { return sessionStorage.getItem("radar:" + k); } catch { return null; } },
  };

  /* ---- Duimpjes ----
     Bewaard op dit toestel (radar:fb). Versturen = één GitHub-issue "Feedback: ..." met een
     JSON-blok; GitHub Actions verwerkt het direct (scripts/collect_feedback.py). */
  const FB_UP = { praktisch: "Praktisch toepasbaar", goed_uitgelegd: "Goed uitgelegd", nieuw_voor_mij: "Nieuw voor mij", mijn_stack: "Past bij mijn stack", meer_hiervan: "Meer hiervan" };
  const fbPoints = () => Math.round((state.feed?.feedback?.weight || 0.15) * 100);   // maximaal effect in punten
  const FB_DOWN = { te_basic: "Te basic", niet_mijn_stack: "Niet mijn stack", oud_nieuws: "Oud nieuws", te_vaag: "Te vaag", geen_interesse: "Interesseert me niet" };
  const fb = {
    all() { try { return JSON.parse(localStorage.getItem("radar:fb") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:fb", JSON.stringify(d)); } catch {} },
    get(id) { return this.all()[id]; },
    set(id, v) { const d = this.all(); if (v) d[id] = v; else delete d[id]; this.save(d); },
    pending() { return Object.entries(this.all()).filter(([, v]) => !v.sent); },
  };
  /* ---- Gelezen ----
     Een artikel of verdieping telt als gelezen als je tot onderaan scrolt en het minstens
     15 seconden open had. Bewaard op dit toestel (radar:read). Gelezen artikelen gaan mee met
     je feedback als licht signaal (0,5; een duim omhoog telt 2). */
  const READ_MS = window.__radarReadMs || 15000;   // __radarReadMs alleen voor de tests
  const reads = {
    all() { try { return JSON.parse(localStorage.getItem("radar:read") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:read", JSON.stringify(d)); } catch {} },
    mark(key) { const d = this.all(); if (d[key]) return; d[key] = { at: new Date().toISOString(), sent: false }; this.save(d); },
    pendingArticles() { return Object.entries(this.all()).filter(([k, v]) => k.startsWith("a-") && !v.sent).map(([k]) => k.slice(2)); },
    since(ms) { return Object.entries(this.all()).filter(([, v]) => Date.parse(v.at) >= ms).map(([k]) => k); },
  };
  let readTimer = null, readObs = null;
  function trackRead(key) {
    clearTimeout(readTimer); readObs?.disconnect();
    const end = $("#reader .read-end"); if (!end || reads.all()[key]) return;
    const t0 = Date.now();
    readObs = new IntersectionObserver((es) => {
      if (!es.some((e) => e.isIntersecting)) return;
      readObs.disconnect();
      readTimer = setTimeout(() => { if (location.hash === "#" + key) reads.mark(key); }, Math.max(0, READ_MS - (Date.now() - t0)));
    });
    readObs.observe(end);
  }
  const TZ = "Europe/Amsterdam";
  const dateOnly = (iso) => /T00:00:00(\.000)?Z$/.test(iso);
  function fmtDate(iso) {
    if (!iso) return "datum onbekend";
    const d = new Date(iso);
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric", timeZone: dateOnly(iso) ? "UTC" : TZ });
  }
  function fmtDateTime(iso) {
    if (!iso) return "onbekend";
    return new Date(iso).toLocaleString("nl-NL", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ });
  }
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  const TYPE_LABEL = { official_docs: "Officieel", vendor_blog: "Leverancier", expert_blog: "Vakmens", technical_article: "Technisch", independent_news: "Onafhankelijk" };
  const SRC_STATUS = { ok: "werkt", failed: "mislukt", not_supported: "niet ondersteund", skipped: "handmatig", not_fetched: "niet opgehaald" };
  const MODE = {
    live: { label: "Live", color: "var(--ok)", text: "Alle feeds zijn opgehaald." },
    partial: { label: "Gedeeltelijk live", color: "var(--warn)", text: "Niet alle bronnen konden worden opgehaald." },
    snapshot: { label: "Momentopname", color: "var(--warn)", text: "" },
    demo: { label: "Demonstratiedata", color: "var(--bad)", text: "Geen echt nieuws: alleen om de app te testen." },
    stale: { label: "Verouderd", color: "var(--bad)", text: "Ophalen mislukt; je ziet de vorige feed." },
  };

  const source = (id) => state.feed.sources.find((s) => s.id === id) || { name: id, type: "" };
  const groupLabel = (id) => (state.feed.groups.find((g) => g.id === id) || { label: id }).label;
  const firstSentence = (t) => (String(t || "").match(/^.*?[.!?](\s|$)/) || [t])[0].trim();

  // Geel lampje rechtsonder: het artikel gaat vooral over iets dat je nog aan het leren bent
  // (pipeline/score.py zet a.learning; learning: true in interests.yml).
  function lamp(a) {
    const t = a?.learning;
    return t ? `<span class="lamp" title="Leeronderwerp: ${esc(t)}" aria-label="Leeronderwerp: ${esc(t)}" role="img"><svg viewBox="0 0 12 15" aria-hidden="true"><path fill="currentColor" d="M6 .8a4.4 4.4 0 0 0-2.6 8c.4.3.6.7.6 1.2v.3h4v-.3c0-.5.2-.9.6-1.2A4.4 4.4 0 0 0 6 .8Z"/><path d="M4.4 11.9h3.2M4.9 13.5h2.2" stroke="currentColor" stroke-width=".6" stroke-linecap="round" fill="none"/></svg></span>` : "";
  }
  function bars(score, a) {
    const n = Math.max(1, Math.min(5, Math.ceil((score || 0) / 20)));
    return `<span class="signal" title="Relevantie ${score} van 100"><span class="bars" aria-hidden="true">${[1,2,3,4,5].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>${score}</span>`;
  }

  /* ---- Laden ---- */
  async function load() {
    try {
      const res = await fetch(FEED_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`het bestand gaf status ${res.status}`);
      const feed = await res.json();
      if (feed.schema_version !== SUPPORTED_SCHEMA) throw new Error(`onbekende feedversie ${feed.schema_version}`);
      if (!Array.isArray(feed.articles)) throw new Error("het bestand bevat geen artikellijst");
      state.feed = feed;
      feed.articles.forEach((a) => state.byId.set(a.id, a));
      (feed.deepdives || []).forEach((d) => state.ddById.set(d.id, d));
      // Bij openen altijd: Actueel > Nieuw, en Verdieping op Verdiepingen (T, 1-11-2026).
      // Binnen een sessie onthoudt de app wel waar je was.
      state.sort = store.session("sort") === "trends" ? "trends" : "date";
      state.view = ["verdieping", "leren"].includes(store.session("view")) ? store.session("view") : "actueel";
      state.ddTab = ["morgen", "later"].includes(store.session("ddTab")) ? store.session("ddTab") : "alle";
      renderStatus();
      renderSeg();
      updateMenuDot();
      keepStorage();
      route();
    } catch (e) {
      $("#upd").textContent = "Niet geladen";
      $("#status").hidden = false;
      $("#status").innerHTML = `<span class="dot" style="background:var(--bad)"></span><span><strong>De feed kon niet worden geladen.</strong> ${esc(e.message)}. Controleer of feed.json naast de app staat.</span>`;
      $("#content").innerHTML = `<div class="empty"><h3>Geen artikelen beschikbaar</h3><p>De app vindt geen leesbare feed. Probeer het opnieuw.</p><button class="btn" type="button" id="retry">Opnieuw laden</button></div>`;
      $("#retry").onclick = () => location.reload();
    }
  }

  function renderStatus() {
    const f = state.feed, m = MODE[f.mode] || MODE.partial;
    const ok = f.sources.filter((s) => s.status === "ok").length;
    const fine = f.mode === "live" && ok === f.sources.length;
    const updIso = newestAdded(f) || f.last_article_added_at || f.last_successful_update || f.generated_at;
    const upd = fmtDateTime(updIso);
    const ud = new Date(updIso);
    const day = ud.toLocaleDateString("nl-NL", { day: "numeric", month: "short", timeZone: TZ });
    const time = ud.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
    $("#upd").innerHTML = `<span class="dot" style="background:${m.color}"></span><span><span>${esc(day)}</span><span>${esc(time)}</span></span>`;   // alleen bolletje + datum/tijd, rechts
    $("#upd").title = $("#upd").ariaLabel = `Nieuwe artikelen toegevoegd op ${upd}`;
    const st = $("#status");
    st.hidden = fine;
    if (!fine) {
      const text = f.mode === "snapshot" ? `Momentopname uit ${ok} bronnen; wordt niet automatisch ververst.` : `${m.text} ${ok} van ${f.sources.length} bronnen leverden artikelen.`;
      st.innerHTML = `<span class="dot" style="background:${m.color}"></span><span><strong>${esc(m.label)}</strong><br>${esc(text)} <a href="#feedcontrole">Status</a></span>`;
    }
  }

  /* ---- Filters ---- */
  function inPeriod(a) {
    if (state.period === "all") return true;
    if (!a.published_at) return false;
    const ref = Date.parse(state.feed.last_successful_update || state.feed.generated_at);
    const days = state.period === "week" ? 7 : 31;
    return ref - Date.parse(a.published_at) <= days * 864e5;
  }
  function matches(a) {
    if (state.group !== "all" && !(a.groups || []).includes(state.group)) return false;
    if (!inPeriod(a)) return false;
    if (state.q) {
      const hay = norm([a.headline, a.title, a.summary, a.excerpt, source(a.source_id).name, ...(a.topics || []).map((t) => state.feed.topics[t]?.name)].join(" "));
      if (!norm(state.q).split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }
  function sorted(list) {
    const l = [...list];
    // "Nieuw" = nieuw in de radar: wanneer Claude het uitlegde, anders wanneer het werd opgehaald.
    const t = (iso) => (iso ? Date.parse(iso) || 0 : 0);
    const added = (a) => t(a.processed_at) || t(a.fetched_at) || t(a.published_at);
    if (state.sort === "date") l.sort((a, b) => added(b) - added(a) || t(b.published_at) - t(a.published_at));
    else l.sort((a, b) => b.relevance_score - a.relevance_score || (b.published_at || "").localeCompare(a.published_at || ""));
    // Nooit meer dan 2 kaarten van dezelfde bron achter elkaar; "Nieuw" en "Eerder" apart, zodat de scheidslijn klopt.
    if (state.sort === "date") { const nw = l.filter(isNew); return spread(nw).concat(spread(l.filter((a) => !isNew(a)))); }
    return spread(l);
  }
  function spread(list, max = 2) {
    const rest = [...list], out = [];
    while (rest.length) {
      const run = out.length >= max && out.slice(-max).every((a) => a.source_id === out[out.length - 1].source_id) ? out[out.length - 1].source_id : null;
      const i = run ? rest.findIndex((a) => a.source_id !== run) : 0;
      out.push(rest.splice(i < 0 ? 0 : i, 1)[0]);
    }
    return out;
  }

  function renderSeg() {
    document.querySelectorAll("#seg-sort button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.sort));
    document.querySelectorAll("#seg-view button").forEach((b) => b.setAttribute("aria-selected", b.dataset.v === state.view));
    $("#seg-sort").hidden = state.view !== "actueel";
    // De tijd hoort alleen bij Actueel. Onzichtbaar maken i.p.v. weghalen: dan blijft de kop even hoog
    // en verspringen logo en titel niet bij het wisselen van tabblad.
    $("#upd").style.visibility = state.view === "actueel" ? "" : "hidden";
    $("#seg-dd").hidden = state.view !== "verdieping";
    document.querySelectorAll("#seg-dd button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.ddTab));
  }

  /* ---- Lijst ---- */
  // Datum waarop het artikel in de app kwam (uitgelegd, anders opgehaald), kort als 29-10.
  const addedAt = (a) => a.processed_at || a.fetched_at || a.published_at;
  const shortDate = (iso) => new Date(iso).toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit", timeZone: TZ });
  // Datum-tijd van het nieuwste artikel in de app.
  const newestAdded = (f) => [...(f.articles || []).map(addedAt), ...(f.deepdives || []).map((d) => d.written_at)].filter(Boolean).sort((x, y) => Date.parse(y) - Date.parse(x))[0];
  /* Bezoeken: bij het openen van de app (nieuwe sessie) onthouden we wanneer je de vorige keer keek.
     Artikelen die daarna in de app kwamen staan bovenaan onder "Nieuw sinds je laatste bezoek". */
  const visit = (() => {
    try {
      let prev = sessionStorage.getItem("radar:prevVisit");
      if (prev === null) {
        prev = localStorage.getItem("radar:lastVisit") || "";
        sessionStorage.setItem("radar:prevVisit", prev);
        localStorage.setItem("radar:lastVisit", new Date().toISOString());
      }
      return Date.parse(prev) || 0;
    } catch { return 0; }
  })();
  const isNew = (a) => visit && Date.parse(addedAt(a) || "") > visit;
  const isRead = (key) => !!reads.all()[key];
  function card(a) {
    const s = source(a.source_id);
    const body = a.processing_status === "enriched" ? a.summary : a.excerpt;
    const read = isRead("a-" + a.id);
    return `<article class="card${a.learning ? " leer" : ""}${read ? " read" : ""}" data-id="${esc(a.id)}" tabindex="0" role="link" aria-label="${esc(a.headline || a.title)}${read ? " (gelezen)" : ""}">
      <div class="meta"><span class="src">${read ? `<span class="read-tick" title="Gelezen">✓</span>` : ""}${addedAt(a) ? `<span class="card-date">${esc(shortDate(addedAt(a)))}</span>` : ""}${esc(s.name)}</span>${a.article_type === "opinie" ? `<span class="pill opinie">opinie</span>` : ""}${bars(a.relevance_score, a)}</div>
      <h3>${esc(a.headline || a.title)}</h3>
      ${body ? `<p class="sum">${esc(body)}</p>` : ""}
      ${lamp(a)}
    </article>`;
  }

  // Eigen voorstel van T (uit Later): plan_id begint met "eigen-"
  const isOwn = (d) => String(d.plan_id || d.id || "").startsWith("eigen-");
  const ownPill = (d) => isOwn(d) ? `<span class="pill eigen">jouw voorstel</span>` : "";
  function ddCard(d) {
    const read = isRead("v-" + d.id);
    return `<article class="card${read ? " read" : ""}" data-dd="${esc(d.id)}" tabindex="0" role="link" aria-label="${esc(d.headline)}">
      <div class="meta"><span class="src"><span class="card-date">${esc(shortDate(d.written_at))}</span></span>${ownPill(d)}<span>${d.reading_minutes} min lezen</span></div>
      <h3>${esc(d.headline)}</h3>
      <p class="sum">${esc(d.summary)}</p>
    </article>`;
  }
  /* ---- Keuzes voor de verdieping van morgen ----
     De app is een statische site en kan zelf niets in de repository zetten. Een keuze wordt
     daarom een GitHub-issue "Verdieping: <id>" dat je met één tik aanmaakt. De Claude-taak
     leest dat de volgende ochtend (scripts/next_deepdive.py). Alleen issues van de eigenaar tellen. */
  const AREA_LABEL = { eigen: "Jouw lijst", data_engineering: "Data engineering", context_agents: "Context & agents", claude: "Claude", new_tech: "Nieuwe technologie" };
  const repo = () => state.feed.repo || "tomasr91/data-ai-radar";
  // Bovenaan elk issue: een link terug naar de app. Na "Create" toont GitHub het issue; één tik en je bent terug.
  const backLink = (hash = "") => `**[↩ Terug naar de Data & AI Radar](${location.origin}${location.pathname}${hash ? "#" + hash : ""})**\n\n`;
  function issueUrl(o) {
    const body = backLink() + `Gekozen in de Data & AI Radar.\n\n**${o.title}**\n\n${o.question}\n\nClaude schrijft deze verdieping bij de volgende ochtendrun en sluit dit issue daarna.`;
    return `https://github.com/${repo()}/issues/new?title=${encodeURIComponent("Verdieping: " + o.id)}&body=${encodeURIComponent(body)}`;
  }
  function optCard(o, chosen) {
    const inner = `<div class="meta"><span class="src">${esc(AREA_LABEL[o.area] || "Verdieping")}</span>${chosen ? `<span class="pill verdieping">morgen</span>` : ""}</div>
      <h3>${esc(o.title)}</h3>
      ${o.question ? `<p class="sum">${esc(o.question)}</p>` : ""}
      ${o.why && !chosen ? `<p class="why">${esc(o.why)}</p>` : ""}`;
    return chosen ? `<article class="card opt chosen" data-opt="${esc(o.id)}">${inner}</article>`
      : `<a class="card opt" href="${esc(issueUrl(o))}" target="_blank" rel="noopener" data-opt="${esc(o.id)}">${inner}</a>`;
  }
  function renderPicker() {
    const o = state.feed.deepdive_options;
    // Eigen voorstellen (eigen-...) tellen niet als keuze: die komen er naast de gewone verdieping bij.
    const all = state.chosen || [];
    const chosen = all.filter((id) => !id.startsWith("eigen-"));
    const own = all.filter((id) => id.startsWith("eigen-"));
    const known = new Map((o?.options || []).map((x) => [x.id, x]));
    const mine = new Map(later.all().map((x) => [x.id, x]));
    const ownNote = own.length ? `<p class="own-next">Ook morgen: jouw voorstel ${own.map((id) => `<b>${esc(mine.get(id)?.title || id.slice(6).replace(/-/g, " "))}</b>`).join(" en ")}.</p>` : "";
    if (chosen.length) {
      // Er is gekozen: alleen die keuze, als de verdieping van morgen.
      return `<div class="cards">${chosen.map((id) => optCard(known.get(id) || { id, title: id }, true)).join("")}</div>${ownNote}`;
    }
    if (!o?.options?.length) return `<div class="empty"><h3>Nog geen keuzes</h3><p>Claude zet morgenochtend 5 onderwerpen klaar.</p></div>${ownNote}`;
    return `<div class="cards">${o.options.map((x) => optCard(x)).join("")}</div>${ownNote}`;
  }
  let chosenAt = 0;
  async function loadChosen(force) {
    if (!force && Date.now() - chosenAt < 60e3) return;
    chosenAt = Date.now();
    try {
      const owner = repo().split("/")[0].toLowerCase();
      // Unieke URL en no-store: anders geeft GitHub tot een minuut een oude lijst terug
      const res = await fetch(`https://api.github.com/repos/${repo()}/issues?state=open&per_page=50&t=${Date.now()}`, { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) return;
      const ids = (await res.json())
        .filter((i) => !i.pull_request && (i.user?.login || "").toLowerCase() === owner)
        .map((i) => (String(i.title).match(/^\s*Verdieping:\s*([a-z0-9-]+)\s*$/i) || [])[1]).filter(Boolean).map((x) => x.toLowerCase());
      if (ids.join() !== (state.chosen || []).join()) { state.chosen = ids; if (state.view === "verdieping" && $("#reader").hidden) renderList(); }
    } catch { /* offline of GitHub niet bereikbaar: keuzes blijven gewoon zichtbaar */ }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.feed && state.view === "verdieping") loadChosen(true); });

  /* ---- Trends: "Dit speelt nu" (data/trends.json, geschreven door de Claude-taak) ---- */
  function renderTrends() {
    const ts = state.feed.trends || [];
    if (!ts.length) return `<div class="empty" style="margin-top:14px"><h3>Nu geen trends</h3><p>Een trend verschijnt als minstens drie artikelen uit verschillende bronnen over dezelfde ontwikkeling gaan. Claude kijkt daar elke ochtend naar.</p></div>`;
    return `<p class="pick-note">Waar meerdere bronnen nu tegelijk over schrijven.</p>` + ts.map((t) => {
      const arts = t.article_ids.map((id) => state.byId.get(id)).filter(Boolean);
      const srcs = new Set(arts.map((a) => a.source_id)).size;
      return `<section class="trend card" data-trend="${esc(t.id)}">
        <div class="meta"><span class="src">Dit speelt nu</span><span>${arts.length} artikelen · ${srcs} bronnen</span></div>
        <h3>${esc(t.title)}</h3>
        <p class="sum">${esc(t.summary)}</p>
        <ul class="trend-list">${arts.map((a) => `<li><button type="button" data-id="${esc(a.id)}"><span class="t">${esc(a.headline || a.title)}</span><span class="m">${esc(source(a.source_id).name)}</span></button></li>`).join("")}</ul>
      </section>`;
    }).join("");
  }

  /* ---- Leren ----
     Het examen staat in leren/index.html en draait in een venster (iframe) van dezelfde site.
     Het venster blijft bestaan als je van tabblad wisselt, zodat je midden in een vraag kunt terugkomen.
     De hoogte groeit mee met de inhoud, zodat je gewoon met de pagina scrolt. */
  function showLeren(on) {
    $("#main").hidden = on;
    $("#leren").hidden = !on;
    if (!on || $("#leren-frame")) return;
    const fr = document.createElement("iframe");
    fr.id = "leren-frame"; fr.className = "leren-frame"; fr.title = "Claude-examen oefenen"; fr.src = "leren/index.html";
    fr.addEventListener("load", () => {
      try {
        const d = fr.contentDocument;
        const fit = () => { fr.style.height = Math.max(d.documentElement.scrollHeight, 400) + "px"; };
        new ResizeObserver(fit).observe(d.body); fit();
      } catch { fr.style.height = "85vh"; }
    });
    $("#leren").appendChild(fr);
  }

  function renderList() {
    const f = state.feed;
    showLeren(state.view === "leren");
    if (state.view === "leren") return;
    if (state.view === "verdieping") {
      const dds = [...(f.deepdives || [])].sort((a, b) => Date.parse(b.written_at) - Date.parse(a.written_at));
      $("#content").innerHTML = state.ddTab === "morgen" ? renderPicker() : state.ddTab === "later" ? renderLaterTab()
        : dds.length ? reviewBar() + `<div class="cards">${dds.map(ddCard).join("")}</div>`
        : `<div class="empty"><h3>Nog geen verdiepingen</h3><p>Kies bij Morgen een onderwerp. Claude schrijft hem de volgende ochtend.</p></div>`;
      loadChosen();
      return;
    }
    if (state.sort === "trends") { $("#content").innerHTML = renderTrends(); return; }
    const list = sorted(f.articles.filter(matches));
    let html = "";
    if (!list.length) {
      const missing = f.quality_report?.topics_without_source || [];
      const groupMissing = state.group !== "all" && missing.some((t) => f.topics[t]?.group === state.group);
      html += `<div class="empty"><h3>Nog geen artikelen</h3><p>Er zijn nu geen artikelen om te tonen. Kom later terug.</p></div>`;
    } else {
      // Op "Nieuw": eerst wat sinds je laatste bezoek binnenkwam, daarna een scheidslijn "Eerder"
      const nNew = state.sort === "date" ? list.filter(isNew).length : 0;
      const cards = list.map((a, i) => (nNew && i === nNew && i < list.length ? `<div class="since-line"><span>Eerder</span></div>` : "") + card(a)).join("");
      const sb = fbSendBar(); html += weekBar() + `<div class="cards${sb ? " has-float" : ""}">${cards}</div>` + sb;
    }
    $("#content").innerHTML = html;
  }

  /* ---- Controlevragen ----
     Antwoorden bewaard op dit toestel (radar:quiz). Fout = na 7 dagen terug als herhaling. */
  const quiz = {
    all() { try { return JSON.parse(localStorage.getItem("radar:quiz") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:quiz", JSON.stringify(d)); } catch {} },
    due() {
      const now = Date.now(), d = this.all();
      return Object.entries(d).filter(([, v]) => !v.ok && Date.parse(v.due) <= now).map(([k]) => k);
    },
  };
  const qLookup = (key) => { const [dd, i] = key.split(":"); const d = state.ddById.get(dd); return d?.quiz?.[Number(i)] ? { d, q: d.quiz[Number(i)] } : null; };
  function qItem(key, review) {
    const hit = qLookup(key); if (!hit) return "";
    const { d, q } = hit, rec = quiz.all()[key];
    const answered = rec && (!review || rec.review);
    return `<li class="q" data-q="${esc(key)}" data-review="${review ? 1 : 0}">
      ${review ? `<p class="q-from">${esc(d.headline)}</p>` : ""}
      <p class="q-text">${esc(q.question)}</p>
      <div class="q-opts">${q.options.map((o, i) => `<button type="button" data-opt-i="${i}" ${answered ? "disabled" : ""}
        class="${answered && i === q.answer ? "right" : ""}${answered && rec.pick === i && i !== q.answer ? " wrong" : ""}">${esc(o)}</button>`).join("")}</div>
      ${answered ? `<p class="q-exp"><b>${rec.pick === q.answer ? "Goed." : "Niet goed."}</b> ${esc(q.explanation)}${rec.pick !== q.answer ? " Deze vraag komt over een week terug." : ""}</p>` : ""}
    </li>`;
  }
  function quizBlock(d) {
    if (!d.quiz?.length) return "";
    return `<section class="block quiz"><h2>Test jezelf</h2><ol class="q-list">${d.quiz.map((_, i) => qItem(`${d.id}:${i}`)).join("")}</ol></section>`;
  }
  function quizClick(e) {
    const b = e.target.closest("[data-opt-i]"); if (!b || b.disabled) return;
    const li = b.closest(".q"), key = li.dataset.q, review = li.dataset.review === "1";
    const hit = qLookup(key); if (!hit) return;
    const pick = Number(b.dataset.optI), ok = pick === hit.q.answer, d = quiz.all();
    d[key] = { ok: ok || (d[key]?.ok && !review), pick, at: new Date().toISOString(), due: new Date(Date.now() + 7 * 864e5).toISOString(), review };
    if (review && ok) d[key].ok = true;
    quiz.save(d);
    li.outerHTML = qItem(key, review);
  }
  function reviewBar() {
    const n = quiz.due().filter(qLookup).length;
    return n ? `<a class="fb-send" href="#herhaling"><span>${n} vraag${n === 1 ? "" : "en"} om te herhalen</span><b>Herhalen ›</b></a>` : "";
  }
  function renderReview() {
    const keys = quiz.due().filter(qLookup);
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Herhaling</span></div></div>
      <article class="full wrap"><h1>Herhaling</h1>
      ${keys.length ? `<p class="lead">Deze vragen had je een week geleden niet goed. Lukt het nu?</p><section class="block quiz"><ol class="q-list">${keys.map((k) => { const d = quiz.all(); delete d[k].review; quiz.save(d); return qItem(k, true); }).join("")}</ol></section>`
        : `<p class="lead">Niets te herhalen. Goed bezig.</p>`}</article>`);
  }

  /* ---- Jouw lijst ("Later bekijken") ----
     Onderwerpen die je later nog wilt bekijken, met een notitie en waar je het zag.
     Alleen op dit toestel (radar:later). "Maak hier een verdieping van" opent een GitHub-issue
     "Verdieping: eigen-<slug>"; scripts/next_deepdive.py geeft dat door aan de Claude-taak. */
  const later = {
    all() { try { return JSON.parse(localStorage.getItem("radar:later") || "[]"); } catch { return []; } },
    save(d) { try { localStorage.setItem("radar:later", JSON.stringify(d)); } catch {} },
    add(item) { const d = this.all().filter((x) => x.id !== item.id); d.unshift(item); this.save(d); },
    remove(id) { this.save(this.all().filter((x) => x.id !== id)); },
    fromDoc(key) { return this.all().find((x) => x.from?.key === key); },
  };
  const slug = (t) => "eigen-" + (t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50).replace(/-+$/, "") || "onderwerp");
  function laterBlock(key, title) {
    const saved = later.fromDoc(key);
    return `<section class="later" id="later" data-key="${esc(key)}" data-title="${esc(title)}">
      ${saved ? `<p class="later-done">✓ <b>${esc(saved.title)}</b> staat op je lijst · <a href="#lijst">Bekijk lijst ›</a></p>`
        : `<button type="button" class="act-btn" data-later="open">＋ Later</button>`}</section>`;
  }
  function laterClick(e) {
    const box = e.target.closest("#later"); if (!box) return false;
    const act = e.target.closest("[data-later]")?.dataset.later; if (!act) return false;
    if (act === "open") {
      box.innerHTML = `<div class="later-form"><h2 style="font-size:1.05rem;margin:0">Later bekijken</h2>
        <input id="later-t" type="text" maxlength="100" value="${esc(box.dataset.title)}" aria-label="Onderwerp">
        <textarea id="later-n" rows="2" maxlength="400" placeholder="Notitie (optioneel): waar ben je benieuwd naar?" aria-label="Notitie"></textarea>
        <div class="row"><button type="button" class="btn" data-later="save">Op mijn lijst</button><button type="button" class="btn ghost" data-later="cancel">Annuleren</button></div></div>`;
      const t = $("#later-t", box); t.focus(); t.select();
    } else if (act === "save") {
      const title = $("#later-t", box).value.trim(); if (!title) return true;
      const key = box.dataset.key, kind = key.startsWith("v-") ? "v" : "a";
      later.add({ id: slug(title), title, note: $("#later-n", box).value.trim(), at: new Date().toISOString(),
        from: { key, kind, id: key.slice(2), title: box.dataset.title } });
      box.outerHTML = laterBlock(key, box.dataset.title);
    } else if (act === "cancel") {
      box.outerHTML = laterBlock(box.dataset.key, box.dataset.title);
    }
    return true;
  }
  function laterIssueUrl(x) {
    const from = x.from ? `${x.from.title} (${location.origin}${location.pathname}#${x.from.key})` : "";
    const body = backLink("lijst") + `Eigen onderwerp uit Jouw lijst in de Data & AI Radar.\n\nOnderwerp: ${x.title}\n${x.note ? `Notitie: ${x.note.replace(/\s+/g, " ")}\n` : ""}${from ? `Gezien in: ${from}\n` : ""}\nClaude schrijft deze verdieping bij de volgende ochtendrun en sluit dit issue daarna.`;
    return `https://github.com/${repo()}/issues/new?title=${encodeURIComponent("Verdieping: " + x.id)}&body=${encodeURIComponent(body)}`;
  }
  function renderLater(canChoose) {
    const items = later.all();
    const written = new Map((state.feed.deepdives || []).map((d) => [d.plan_id || d.id, d]));
    const chosen = new Set(state.chosen || []);
    return `<p class="pick-note">Wat je nog wilt bekijken. Maak er een verdieping van, of tik op Klaar als je het gezien hebt.</p>
      <div class="later-list">${items.map((x) => {
        const dd = written.get(x.id);
        const act = dd ? `<a class="btn" href="#v-${esc(dd.id)}">Lees de verdieping ›</a>`
          : chosen.has(x.id) ? `<span class="pill verdieping">morgen</span>`
          : canChoose ? `<a class="btn" href="${esc(laterIssueUrl(x))}" target="_blank" rel="noopener" data-later-pick="${esc(x.id)}">Maak hier een verdieping van</a>` : "";
        const fromLink = x.from && (x.from.kind === "a" ? state.byId.has(x.from.id) : state.ddById.has(x.from.id))
          ? `<a href="#${esc(x.from.key)}">${esc(x.from.title)}</a>` : esc(x.from?.title || "");
        return `<div class="later-item" data-later-id="${esc(x.id)}"><h3>${esc(x.title)}</h3>
          ${x.note ? `<p class="later-note">${esc(x.note)}</p>` : ""}
          <span class="from">${fromLink ? `Gezien in: ${fromLink} · ` : ""}${esc(fmtDate(x.at))}</span>
          <div class="later-acts">${act}<button type="button" class="btn ghost" data-later-done="${esc(x.id)}">Klaar</button></div></div>`;
      }).join("")}</div>
      ${canChoose ? `<p class="pick-note">Maak je er een verdieping van, dan opent GitHub. Claude schrijft hem vannacht, naast je gewone keuze, en morgenochtend staat hij er met het label <b>jouw voorstel</b>. Je onderwerp en notitie komen in een openbaar issue: zet er niets van je werk in.</p>` : ""}`;
  }

  function renderLaterTab() {
    if (!later.all().length) return `<div class="empty" style="margin-top:14px"><h3>Nog niets bewaard</h3><p>Tik onder een artikel of verdieping op <b>＋ Later bekijken</b> om iets op deze lijst te zetten.</p></div>`;
    return renderLater(true);
  }

  /* ---- Mijn interesses ----
     Wat de radar als interessant ziet (feed.interests, uit interests.yml), Claudes voorstellen
     (feed.interest_suggestions, elke zondag) en het logboek. Je reacties blijven op dit toestel
     (radar:int) tot je ze verstuurt als issue "Interesses: ..."; Claude verwerkt ze 's nachts. */
  const LEVEL = { 5: "kern", 4: "belangrijk", 3: "regelmatig", 2: "af en toe", 1: "alleen groot nieuws" };
  const KIND = { nieuw: "Nieuw onderwerp", belangrijker: "Belangrijker maken", minder: "Minder belangrijk maken", weg: "Weghalen" };
  const CHG = { belangrijker: "Belangrijker", minder: "Minder", weg: "Weg" };
  const intStore = {
    get() { try { return Object.assign({ answers: {}, changes: {}, learn: {}, note: "", sentAnswers: {} }, JSON.parse(localStorage.getItem("radar:int") || "{}")); } catch { return { answers: {}, changes: {}, learn: {}, note: "", sentAnswers: {} }; } },
    save(d) { try { localStorage.setItem("radar:int", JSON.stringify(d)); } catch {} },
  };
  function openSuggestions() {
    const d = intStore.get();
    return (state.feed?.interest_suggestions || []).filter((x) => !d.answers[x.id] && !d.sentAnswers[x.id]);
  }
  function updateMenuDot() {
    const n = openSuggestions().length;
    $("#btn-menu")?.classList.toggle("has-dot", n > 0);
    const md = $("#menu-dot"); if (md) md.hidden = !n;
  }
  function intPending(d) { return Object.keys(d.answers).length + Object.keys(d.changes).length + Object.keys(d.learn).length + (d.note.trim() ? 1 : 0); }
  // Interesses gaan mee in het gezamenlijke feedback-issue (verstuurbalk op Actueel).
  function intParts(d) {
    const topics = new Map((state.feed.interests?.topics || []).map((t) => [t.id, t.name]));
    const sugg = new Map((state.feed.interest_suggestions || []).map((x) => [x.id, x]));
    const lines = [
      ...Object.entries(d.answers).map(([id, a]) => `- Voorstel "${sugg.get(id)?.name || topics.get(sugg.get(id)?.topic) || id}" (${(KIND[sugg.get(id)?.kind] || "").toLowerCase()}): ${a}`),
      ...Object.entries(d.changes).map(([t, c]) => `- ${topics.get(t) || t}: ${c}`),
      ...Object.entries(d.learn).map(([t, on]) => `- ${topics.get(t) || t}: ${on ? "leeronderwerp (geel lampje)" : "geen leeronderwerp meer"}`),
      ...(d.note.trim() ? [`- In mijn eigen woorden: ${d.note.trim().replace(/\s+/g, " ")}`] : []),
    ];
    const data = { answers: Object.entries(d.answers).map(([id, a]) => ({ id, a })),
      changes: [...Object.entries(d.changes).map(([topic, c]) => ({ topic, c })),
        ...Object.entries(d.learn).map(([topic, on]) => ({ topic, c: on ? "leren" : "niet_leren" }))], note: d.note.trim() };
    return { lines, data };
  }

  function intSendBar() {
    const n = intPending(intStore.get());
    return n ? `<a class="fb-send" href="#" id="int-to-send"><span>${n} wijziging${n === 1 ? "" : "en"} klaar · versturen doe je op Actueel</span><b>Naar Actueel ›</b></a>` : "";
  }
  const INT_LAMP = `<svg class="int-lamp" viewBox="0 0 12 15" aria-label="leeronderwerp" role="img"><path fill="currentColor" d="M6 .8a4.4 4.4 0 0 0-2.6 8c.4.3.6.7.6 1.2v.3h4v-.3c0-.5.2-.9.6-1.2A4.4 4.4 0 0 0 6 .8Z"/><path d="M4.4 11.9h3.2M4.9 13.5h2.2" stroke="currentColor" stroke-width=".6" stroke-linecap="round" fill="none"/></svg>`;
  // Effect van je duimpjes op artikelen over dit onderwerp (relatief, in punten)
  function intEffect(id) {
    const f = state.feed.feedback || {}, v = f.topics?.[id];
    return v == null ? 0 : Math.round((v - (f.offset || 0)) * fbPoints());
  }
  // Eén onderwerp: niveau (jij kiest), je duimpjes (automatisch), en knoppen die zeggen wat er gebeurt
  function intTopicRow(t, d) {
    const p = t.priority, e = intEffect(t.id), chg = d.changes[t.id];
    const learnNow = t.id in d.learn ? d.learn[t.id] : !!t.learning;   // zoals het wordt na versturen
    const to = { belangrijker: p < 5 ? LEVEL[p + 1] : null, minder: p > 1 ? LEVEL[p - 1] : null };
    const btn = (c, label) => `<button type="button" data-int-chg="${c}" aria-pressed="${chg === c}">${label}</button>`;
    const plan = [chg === "weg" ? "Vannacht: uitgezet. Je krijgt er geen artikelen meer over."
      : chg ? `Vannacht: van <b>${esc(LEVEL[p])}</b> naar <b>${esc(to[chg])}</b>.` : "",
      t.id in d.learn ? (d.learn[t.id] ? "Vannacht: wordt leeronderwerp (geel lampje op de kaarten)." : "Vannacht: geen leeronderwerp meer.") : ""].filter(Boolean).join("<br>");
    return `<div class="int-topic" data-topic="${esc(t.id)}">
      <div class="row1"><span class="nm">${esc(t.name)}</span>${learnNow ? INT_LAMP : ""}<span class="lvl-pill lvl-${p}">${esc(LEVEL[p] || "")}</span></div>
      <p class="ds">${esc(t.description)}</p>
      ${e ? `<p class="eff${e < 0 ? " neg" : ""}">Je duimpjes: ${e > 0 ? "+" : "−"}${Math.abs(e)} punten per artikel</p>` : ""}
      <div class="fb-reasons">${to.belangrijker ? btn("belangrijker", `▲ Naar ${to.belangrijker}`) : ""}${to.minder ? btn("minder", `▼ Naar ${to.minder}`) : ""}${btn("weg", "Uitzetten")}<button type="button" class="learn-btn" data-int-learn aria-pressed="${learnNow}" title="${learnNow ? "Leeronderwerp: tik om uit te zetten" : "Markeer als leeronderwerp"}">${INT_LAMP}${learnNow ? "Leeronderwerp" : "Leren"}</button></div>
      ${plan ? `<p class="int-plan">${plan}</p>` : ""}</div>`;
  }
  function renderInterests() {
    const f = state.feed, I = f.interests || { areas: [], topics: [], excluded: [] }, d = intStore.get();
    const fbf = f.feedback || {}, W = fbPoints();
    const topicName = new Map(I.topics.map((t) => [t.id, t.name]));
    const sugg = (f.interest_suggestions || []).map((x) => {
      const ans = d.answers[x.id], sent = d.sentAnswers[x.id];
      return `<div class="int-sugg" data-sugg="${esc(x.id)}"><span class="kind">${esc(KIND[x.kind] || x.kind)}</span>
        <h3>${esc(x.name || topicName.get(x.topic) || x.topic)}</h3>${x.description ? `<p>${esc(x.description)}</p>` : ""}
        <p class="why">${esc(x.why)}</p>
        ${sent ? `<p class="why">Verstuurd: ${esc(sent)}. Claude verwerkt het vannacht.</p>`
          : `<div class="fb-reasons">${["ja", "nee"].map((a) => `<button type="button" data-int-ans="${a}" aria-pressed="${ans === a}">${a === "ja" ? "Ja, doen" : "Nee"}</button>`).join("")}</div>`}</div>`;
    }).join("");
    const areas = [...I.areas, { id: "overig", name: "Overig", share: null }].map((a) => {
      const ts = I.topics.filter((t) => t.area === a.id).sort((x, y) => y.priority - x.priority);
      return ts.length ? `<section class="int-area"><header><h3>${esc(a.name)}</h3>${a.share ? `<span class="share">${Math.round(a.share * 100)}% van je feed</span>` : ""}</header>
        ${ts.map((t) => intTopicRow(t, d)).join("")}</section>` : "";
    }).join("");
    const log = (f.interest_log || []).map((x) => `<li><time>${esc(fmtDate(x.at))}</time>${esc(x.text)}</li>`).join("");
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Mijn interesses</span></div></div>
      <article class="full wrap"><h1>Mijn interesses</h1>
      <p class="lead">Waar de radar voor je op let. Tik aan wat anders moet en verstuur het; Claude past het vannacht aan.</p>
      <div id="int-send-wrap">${intSendBar()}</div>
      ${sugg ? `<section class="int-sec"><h2>Voorstellen van Claude</h2><p class="pick-note">Elke zondag nieuw, op basis van je duimpjes, wat je leest en het nieuws.</p>${sugg}</section>` : ""}
      ${fbEffectBlock()}
      <section class="int-sec"><h2>Jouw onderwerpen</h2><p class="pick-note">In vier gebieden, met hoeveel van je feed elk gebied ongeveer krijgt.</p>${areas}</section>
      <section class="int-sec int-excl"><details><summary>Wat je niet wilt zien (${I.excluded.length})</summary><ul>${I.excluded.map((x) => `<li>${esc(x.name)}</li>`).join("")}</ul></details></section>
      <section class="int-sec"><h2>In je eigen woorden</h2><textarea class="int-note" id="int-note" maxlength="1000" placeholder="Bijv. meer over Fabric, minder over AI-onderzoek">${esc(d.note)}</textarea></section>
      ${log ? `<section class="int-sec"><h2>Recent aangepast</h2><ul class="int-log">${log}</ul></section>` : ""}
      </article>`);
    const note = $("#int-note");
    if (note) note.oninput = () => { const x = intStore.get(); x.note = note.value; intStore.save(x); $("#int-send-wrap").innerHTML = intSendBar(); };
  }
  function intClick(e) {
    if (e.target.closest("#int-to-send")) {
      e.preventDefault(); state.view = "actueel"; state.sort = "date"; renderSeg(); location.hash = "";
      return true;
    }
    const lb = e.target.closest("[data-int-learn]");
    if (lb) {
      const d = intStore.get(), row = lb.closest("[data-topic]"), id = row.dataset.topic;
      const t = (state.feed.interests?.topics || []).find((x) => x.id === id);
      const now = id in d.learn ? d.learn[id] : !!t?.learning;
      if (id in d.learn) delete d.learn[id]; else d.learn[id] = !now;   // tweede tik = terug naar hoe het was
      intStore.save(d);
      if (t) row.outerHTML = intTopicRow(t, d);
      $("#int-send-wrap").innerHTML = intSendBar();
      return true;
    }
    const ab = e.target.closest("[data-int-ans]"), cb = e.target.closest("[data-int-chg]");
    if (!ab && !cb) return false;
    const d = intStore.get();
    if (ab) { const id = ab.closest("[data-sugg]").dataset.sugg; d.answers[id] === ab.dataset.intAns ? delete d.answers[id] : (d.answers[id] = ab.dataset.intAns); }
    if (cb) { const t = cb.closest("[data-topic]").dataset.topic; d.changes[t] === cb.dataset.intChg ? delete d.changes[t] : (d.changes[t] = cb.dataset.intChg); }
    intStore.save(d);
    if (cb) {
      const row = cb.closest("[data-topic]"), t = (state.feed.interests?.topics || []).find((x) => x.id === row.dataset.topic);
      if (t) row.outerHTML = intTopicRow(t, d);
    } else {
      const box = ab.parentElement, val = d.answers[ab.closest("[data-sugg]").dataset.sugg];
      box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.intAns === val)));
    }
    $("#int-send-wrap").innerHTML = intSendBar();
    updateMenuDot();
    return true;
  }

  /* ---- Blijvende opslag ----
     Vraag Chrome om de opslag van de Radar als blijvend te markeren: dan ruimt Chrome die niet zelf op
     als de telefoon vol raakt. Zelf browsergegevens wissen blijft alles weghalen; daarvoor is de back-up.
     Chrome beslist zelf (geen pop-up); bij een geïnstalleerde app wordt het meestal toegestaan. */
  let storagePersisted = null;
  async function keepStorage() {
    try {
      if (!navigator.storage?.persist) return;
      storagePersisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    } catch { storagePersisted = null; }
    showPersist();
  }
  function showPersist() {
    const el = $("#bk-persist"); if (!el) return;
    el.className = "bk-msg" + (storagePersisted ? " ok" : "");
    el.textContent = storagePersisted === true ? "✓ Blijvende opslag: Chrome ruimt je gegevens niet zelf op."
      : storagePersisted === false ? "Chrome heeft de opslag nog niet als blijvend gemarkeerd. Installeer de Radar als app, dan gebeurt dat meestal vanzelf." : "";
  }

  /* ---- Back-up ----
     Alles wat alleen op dit toestel staat in één bestand: de Radar (radar:*) en het examen (cca-academy-v2).
     Wat je al verstuurde (duimpjes, keuzes, interesses) staat ook op GitHub. Terugzetten vervangt wat er nu staat.
     Een oude back-up uit Leren (academy-voortgang-*.json) kan ook worden teruggezet. */
  const BK_APP = "data-ai-radar-backup";
  const bkKeys = () => Object.keys(localStorage).filter((k) => k.startsWith("radar:") || k === "cca-academy-v2");
  function bkSummary(get) {
    const j = (k, d) => { try { return JSON.parse(get(k) || "null") ?? d; } catch { return d; } };
    const leren = j("cca-academy-v2", null), q = Object.values(leren?.certs || {}).reduce((n, c) => n + Object.keys(c.q || {}).length, 0);
    const rows = [
      ["Voortgang bij Leren", q ? `${q} vragen geoefend` : "nog niets"],
      ["Controlevragen en herhaling", `${Object.keys(j("radar:quiz", {})).length} antwoorden`],
      ["Later-lijst", `${j("radar:later", []).length} onderwerpen`],
      ["Gelezen en duimpjes", `${Object.keys(j("radar:read", {})).length} gelezen, ${Object.keys(j("radar:fb", {})).length} duimpjes`],
      ["Bekeken begrippen", `${Object.keys(j("radar:terms", {})).length}`],
    ];
    return `<ul class="bk-list">${rows.map(([a, b]) => `<li><span>${esc(a)}</span><b>${esc(b)}</b></li>`).join("")}</ul>`;
  }
  let bkPending = null;   // gekozen bestand, nog niet teruggezet
  function renderBackup(msg) {
    const p = bkPending;
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Back-up</span></div></div>
      <article class="full wrap"><h1>Back-up</h1>
      <p class="lead">Alles wat alleen op deze telefoon staat, in één bestand.</p>
      <p class="bk-msg" id="bk-persist"></p>
      <section class="block"><h2>Nu op dit toestel</h2>${bkSummary((k) => localStorage.getItem(k))}
        <button type="button" class="btn" id="bk-save">Bewaren in Downloads</button></section>
      <section class="block"><h2>Terugzetten</h2>
        <label class="btn ghost" for="bk-file">Kies een back-upbestand…</label><input type="file" id="bk-file" accept=".json,application/json" hidden>
        ${p ? `<div class="bk-confirm"><p>Back-up van <b>${esc(fmtDateTime(p.at))}</b>:</p>${bkSummary((k) => p.data[k])}
          <p class="small">Dit vervangt wat er nu op dit toestel staat.</p>
          <div class="row"><button type="button" class="btn" id="bk-restore">Terugzetten</button><button type="button" class="btn ghost" id="bk-cancel">Annuleren</button></div></div>` : ""}
        ${msg ? `<p class="bk-msg ${msg.ok ? "ok" : "bad"}">${esc(msg.text)}</p>` : ""}</section>
      </article>`);
    showPersist();
    $("#bk-save").onclick = () => {
      const data = Object.fromEntries(bkKeys().map((k) => [k, localStorage.getItem(k)]));
      const blob = new Blob([JSON.stringify({ app: BK_APP, version: 1, exportedAt: new Date().toISOString(), data }, null, 1)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `radar-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      store.set("backupAt", new Date().toISOString());
      renderBackup({ ok: true, text: "Back-up staat in je Downloads." });
    };
    $("#bk-file").onchange = async (e) => {
      const file = e.target.files?.[0]; if (!file) return;
      try {
        const o = JSON.parse(await file.text());
        if (o?.app === BK_APP && o.data && typeof o.data === "object") {
          const data = Object.fromEntries(Object.entries(o.data).filter(([k, v]) => (k.startsWith("radar:") || k === "cca-academy-v2") && typeof v === "string"));
          bkPending = { at: o.exportedAt, data };
        } else if (o?.app === "claude-certification-academy" && o.state?.v === 2) {
          bkPending = { at: o.exportedAt, data: { "cca-academy-v2": JSON.stringify(o.state) } };   // oude back-up uit Leren
        } else throw new Error();
        renderBackup();
      } catch { bkPending = null; renderBackup({ ok: false, text: "Dit is geen back-up van de Radar." }); }
    };
    if (p) {
      $("#bk-cancel").onclick = () => { bkPending = null; renderBackup(); };
      $("#bk-restore").onclick = () => {
        // Alleen sleutels uit de back-up vervangen; bij een volledige Radar-back-up eerst de oude radar-gegevens weg.
        if (Object.keys(p.data).some((k) => k.startsWith("radar:"))) bkKeys().forEach((k) => localStorage.removeItem(k));
        Object.entries(p.data).forEach(([k, v]) => { try { localStorage.setItem(k, v); } catch {} });
        bkPending = null;
        location.hash = ""; location.reload();
      };
    }
  }

  /* ---- Begrippen ----
     Claude zet bij een stuk `terms` (pipeline/terms.py). De eerste keer dat een begrip in de tekst
     staat wordt het onderstreept; tik erop voor de uitleg. Alle begrippen: menu (tandwiel) > Begrippen. */
  const reEsc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Begrippen die je al eens aantikte: niet meer oranje, alleen nog gestippeld (radar:terms).
  const termsSeen = {
    all() { try { return JSON.parse(localStorage.getItem("radar:terms") || "{}"); } catch { return {}; } },
    has(t) { return !!this.all()[t.trim().toLowerCase()]; },
    add(t) { const d = this.all(); d[t.trim().toLowerCase()] = new Date().toISOString(); try { localStorage.setItem("radar:terms", JSON.stringify(d)); } catch {} },
  };
  function termMarker(terms) {
    const todo = (terms || []).filter((t) => t?.term).sort((a, b) => b.term.length - a.term.length)
      .map((t) => ({ t, re: new RegExp(`(?<![\\p{L}\\p{N}_])${reEsc(esc(t.term.trim()))}(?![\\p{L}\\p{N}_])`, "iu") }));
    const done = new Set();
    return (text) => {
      let h = esc(text);
      for (const x of todo) {
        if (done.has(x)) continue;
        const m = h.match(x.re); if (!m) continue;
        const before = h.slice(0, m.index);
        if (before.lastIndexOf("<") > before.lastIndexOf(">")) continue;   // niet binnen een tag
        if ((before.match(/<button/g) || []).length !== (before.match(/<\/button>/g) || []).length) continue;   // niet binnen een ander begrip
        h = before + `<button type="button" class="term${termsSeen.has(x.t.term) ? "" : " new"}" data-term="${esc(x.t.term)}" data-exp="${esc(x.t.explanation)}">${m[0]}</button>` + h.slice(m.index + m[0].length);
        done.add(x);
      }
      return h;
    };
  }
  function termClick(e) {
    const sheet = $("#term-sheet"); if (!sheet) return false;
    if (e.target.closest("#term-sheet .x")) { sheet.hidden = true; return true; }
    const b = e.target.closest(".term");
    if (!b) { if (!e.target.closest("#term-sheet")) sheet.hidden = true; return false; }
    sheet.innerHTML = `<div class="wrap"><button type="button" class="x" aria-label="Sluiten">×</button><h3>${esc(b.dataset.term)}</h3><p>${esc(b.dataset.exp)}</p><a href="#begrippen">Alle begrippen ›</a></div>`;
    sheet.hidden = false;
    termsSeen.add(b.dataset.term);
    document.querySelectorAll(".term.new").forEach((el) => { if (el.dataset.term.toLowerCase() === b.dataset.term.toLowerCase()) el.classList.remove("new"); });
    return true;
  }
  function renderGlossaryPage() {
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Begrippen</span></div></div>
      <article class="full wrap"><h1>Begrippen</h1>${renderGlossary()}</article>`);
    const q = $("#reader #gl-q");
    if (q) q.oninput = () => { const v = q.value.trim().toLowerCase(); document.querySelectorAll("#reader .gl-item").forEach((el) => { el.hidden = !!v && !el.dataset.k.includes(v); }); };
  }
  const termSheet = `<div class="term-sheet" id="term-sheet" role="dialog" aria-label="Uitleg begrip" hidden></div>`;
  function renderGlossary() {
    const g = state.feed.glossary || [];
    if (!g.length) return `<div class="empty"><h3>Nog geen begrippen</h3><p>Claude zet vanaf nu bij elk stuk de lastige begrippen, ook bij stukken die er al staan. In de tekst zijn ze onderstreept.</p></div>`;
    return `<input class="gl-filter" id="gl-q" type="search" placeholder="Zoek in ${g.length} begrippen" aria-label="Zoek een begrip">
      <dl class="gloss">${g.map((t) => `<div class="gl-item" data-k="${esc((t.term + " " + t.explanation).toLowerCase())}"><dt>${esc(t.term)}</dt><dd>${esc(t.explanation)}
        <span class="gl-refs">Uit: ${t.refs.map((r) => `<a href="#${r.kind}-${esc(r.id)}">${esc(r.title)}</a>`).join(" · ")}</span></dd></div>`).join("")}</dl>`;
  }

  /* ---- Jouw week ----
     Zondag schrijft Claude data/weekly.json (pipeline/weekly.py): de 3 belangrijkste ontwikkelingen.
     De app zet erbij wat alleen op dit toestel staat (laatste 7 dagen): verdiepingen en of je ze las,
     je controlevragen, herhalingen, het Claude-examen (Leren) en wat je las en beoordeelde. */
  // De balk blijft staan tot je hem zelf wegveegt (of op × tikt); per week onthouden (radar:weekGone).
  function isoWeekRange(week) {
    const [y, w] = week.split("-W").map(Number);
    const jan4 = new Date(Date.UTC(y, 0, 4)), mon = new Date(jan4);
    mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    const f = (d) => d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", timeZone: "UTC" });
    return `${f(mon)} – ${f(sun)}`;
  }
  function weekBar() {
    const w = state.feed.weekly;
    if (!w || store.get("weekGone", "") === w.week) return "";
    return `<div class="week-bar" id="week-bar" data-week="${esc(w.week)}"><a class="fb-send" href="#week"><span>Jouw week ${esc(w.week.split("-W")[1].replace(/^0/, ""))} staat klaar</span><b>Bekijken ›</b></a><button type="button" class="week-x" aria-label="Jouw week wegvegen">×</button></div>`;
  }
  function lerenWeek(since) {
    try {
      const st = JSON.parse(localStorage.getItem("cca-academy-v2") || "null");
      if (!st?.certs) return null;
      let practised = 0, mastered = 0;
      Object.values(st.certs).forEach((c) => Object.values(c.q || {}).forEach((x) => {
        if (x.last >= since) practised++;
        if (x.b >= 2) mastered++;
      }));
      return { practised, mastered };
    } catch { return null; }
  }
  // Herinnering in Jouw week als de laatste back-up meer dan 6 dagen oud is (of er nog geen is).
  function backupReminder() {
    const at = Date.parse(store.get("backupAt", "")) || 0, days = Math.floor((Date.now() - at) / 864e5);
    if (at && days < 7) return "";
    return `<a class="fb-send" href="#backup" id="bk-remind"><span>${at ? `Laatste back-up: ${days} dagen geleden` : "Nog geen back-up gemaakt"}</span><b>Nu bewaren ›</b></a>`;
  }
  function renderWeek() {
    const w = state.feed.weekly, since = Date.now() - 7 * 864e5;
    const read = new Set(reads.since(0));
    const hl = w.highlights.map((h) => `<li><h3>${esc(h.title)}</h3><p>${esc(h.why)}</p>
      ${h.article_ids.length ? `<div class="wk-links">${h.article_ids.map((id) => state.byId.get(id)).filter(Boolean)
        .map((a) => `<a href="#a-${esc(a.id)}">${esc(a.headline || a.title)}${read.has("a-" + a.id) ? " ✓" : ""}</a>`).join("")}</div>` : ""}</li>`).join("");
    const dds = (state.feed.deepdives || []).filter((d) => Date.parse(d.written_at) >= since);
    const qs = Object.values(quiz.all()).filter((v) => Date.parse(v.at) >= since);
    const qOk = qs.filter((v) => v.ok).length, due = quiz.due().filter(qLookup).length;
    const lr = lerenWeek(since);
    const readN = reads.since(since).filter((k) => k.startsWith("a-")).length;
    const votesN = Object.values(fb.all()).filter((v) => Date.parse(v.at) >= since).length;
    const stats = [
      dds.length ? `<li>Verdiepingen: <b>${dds.filter((d) => read.has("v-" + d.id)).length} van ${dds.length}</b> gelezen${dds.filter((d) => !read.has("v-" + d.id)).map((d) => `<br><a href="#v-${esc(d.id)}">${esc(d.headline)}</a>`).join("")}</li>` : "",
      qs.length ? `<li>Controlevragen: <b>${qOk} van ${qs.length}</b> goed</li>` : `<li>Controlevragen: nog geen beantwoord deze week</li>`,
      due ? `<li><a href="#herhaling">${plural(due, "vraag", "vragen")} om te herhalen ›</a></li>` : "",
      lr ? `<li>Claude-examen: <b>${lr.practised}</b> vragen geoefend, <b>${lr.mastered}</b> beheerst in totaal</li>` : "",
      `<li>Gelezen: <b>${plural(readN, "artikel", "artikelen")}</b>${votesN ? `, ${plural(votesN, "duimpje", "duimpjes")} gegeven` : ""}</li>`,
    ].join("");
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">${esc(isoWeekRange(w.week))}</span></div></div>
      <article class="full wrap"><h1>Jouw week ${esc(w.week.split("-W")[1].replace(/^0/, ""))}</h1>
      <p class="lead">${esc(w.intro)}</p>
      <section class="block"><h2>Wat er echt toe deed</h2><ol class="wk-list">${hl}</ol></section>
      ${w.focus ? `<section class="try"><h2>Deze week proberen</h2><p>${esc(w.focus)}</p></section>` : ""}
      <section class="block"><h2>Jouw leerweek</h2><ul class="wk-stats">${stats}</ul>${fbSendBar(true)}${backupReminder()}</section>
      </article>`);
  }

  /* ---- Verdieping ---- */
  function renderDeepdive(d) {
    const mark = termMarker(d.terms);
    const topics = (d.topics || []).map((t) => state.feed.topics[t]?.name).filter(Boolean);
    const reading = (d.further_reading || []).map((r) => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>${r.note ? `<span class="why">${esc(r.note)}</span>` : ""}</li>`).join("");
    const html = `
      <div class="bar"><div class="wrap">
        <button class="icon-btn" type="button" id="back" aria-label="Terug naar de lijst"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
        <span class="crumb"></span>
      </div></div>
      <article class="full wrap dd">
        <div class="meta top">${ownPill(d)}<span>${d.reading_minutes} min lezen</span></div>
        <h1>${esc(d.headline)}</h1>
        <p class="lead">${mark(d.summary)}</p>
        ${(d.sections || []).map((s) => `<section class="dd-sec"><h2>${esc(s.heading)}</h2><div class="story">${s.paragraphs.map((p) => `<p>${mark(p)}</p>`).join("")}</div></section>`).join("")}
        ${showcaseBlock(d.showcase)}
        ${d.experiment ? `<section class="try"><h2>Probeer dit</h2><p>${esc(d.experiment)}</p></section>` : ""}
        ${d.limitations?.length ? `<section class="block"><h2>Let op</h2><ul>${d.limitations.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></section>` : ""}
        ${quizBlock(d)}
        <div class="read-end" aria-hidden="true"></div>
        <section class="act-bar">${laterBlock("v-" + d.id, d.headline)}${askBlock("verdieping")}</section>
        ${reading ? `<section class="block"><h2>Verder lezen</h2><ul class="reading">${reading}</ul></section>` : ""}
        <p class="src-line">Geschreven op ${esc(fmtDate(d.written_at))}${d.currency_check ? ` · ${esc(d.currency_check)}` : ""}</p>
      </article>`;
    openReader(html);
    trackRead("v-" + d.id);
  }

  /* ---- Artikel ---- */
  function block(title, kind, text) {
    if (!text) return "";
    const kinds = { bron: "Uit de bron", uitleg: "Uitleg", idee: "Idee" };
    return `<section class="block"><h2>${esc(title)}${kind ? ` <span class="kind ${kind}">${kinds[kind]}</span>` : ""}</h2><p>${esc(text)}</p></section>`;
  }
  /* ---- Zien en doen ----
     showcase: klein stukje echte code met resultaat ("Zo ziet het eruit").
     */
  function resultTable(cols, rows) {
    return `<div class="res-wrap"><table class="res"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v === null ? "NULL" : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function showcaseBlock(sc) {
    if (!sc?.code) return "";
    return `<section class="block show"><h2>Zo ziet het eruit</h2>
      <p class="show-cap">${esc(sc.caption)}</p>
      <pre class="code" data-lang="${esc(sc.language || "")}"><code>${esc(sc.code)}</code></pre>
      ${sc.result?.columns ? `<p class="show-arrow">Resultaat</p>${resultTable(sc.result.columns, sc.result.rows)}` : ""}
      ${sc.note ? `<p class="fb-note">${esc(sc.note)}</p>` : ""}</section>`;
  }


  /* ---- Vraag het Claude ----
     Opent claude.ai (of de Claude-app) met een ingevuld bericht: kern van het stuk, bronlink,
     korte context over de stack, en jouw vraag. claude.ai/new?q= vult de vraag in; de URL blijft
     kort genoeg (< ~6000 tekens) door de uitleg in te korten. Geen sleutels in de app. */
  const ASK_ME = "Over mij: analytics engineer bij een zorgorganisatie. Stack: Azure Databricks (Unity Catalog), dbt, Azure DevOps, Power BI. Externe AI gebruik ik nooit met werk- of patiëntdata.";
  const ASK_CHIPS = ["Leg dit eenvoudiger uit", "Hoe pas ik dit toe in mijn stack?", "Wat zijn de risico's of nadelen?", "Geef een concreet voorbeeld"];
  function askPrompt(ctx, question) {
    const head = `Ik lees in mijn Data & AI Radar ${ctx.kind} en heb een vraag.\n\n${ctx.kind === "dit artikel" ? "Artikel" : "Verdieping"}: ${ctx.title}${ctx.meta ? ` (${ctx.meta})` : ""}${ctx.url ? `\nBron: ${ctx.url}` : ""}\nSamenvatting: ${ctx.summary || ""}`;
    const tail = `\n\n${ASK_ME}\n\nMijn vraag: ${question}\n\nAntwoord in eenvoudig Nederlands, kort en concreet.${ctx.url ? " Lees zo nodig de bron." : ""}`;
    let body = ctx.body || "";
    const room = 1800 - head.length - tail.length;   // 1800 tekens ≈ 6000 na URL-codering
    if (body.length > room) body = room > 200 ? body.slice(0, room).replace(/\s+\S*$/, "") + " …" : "";
    return head + (body ? `\nUitleg uit de radar: ${body}` : "") + tail;
  }
  const askUrl = (ctx, q) => `https://claude.ai/new?q=${encodeURIComponent(askPrompt(ctx, q))}`;
  function askBlock(kind) {
    return `<button type="button" class="act-btn" id="ask-toggle" aria-expanded="false" aria-controls="ask">✦ Vraag Claude</button>
      <section class="ask" id="ask" data-kind="${kind}" hidden>
      <div class="ask-chips">${ASK_CHIPS.map((c) => `<button type="button" data-ask="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <form class="ask-form" id="ask-form"><textarea id="ask-q" rows="2" placeholder="Of stel je eigen vraag…" aria-label="Je vraag over dit stuk"></textarea>
      <button class="btn" type="submit">Vraag Claude ↗</button></form></section>`;
  }
  function askContext() {
    const h = location.hash.slice(1);
    if (h.startsWith("a-")) {
      const a = state.byId.get(h.slice(2)); if (!a) return null;
      return { kind: "dit artikel", title: a.headline || a.title, meta: `${source(a.source_id).name}, ${fmtDate(a.published_at)}`, url: a.url,
        summary: a.summary, body: (a.story || [a.simple_explanation, a.personal_relevance].filter(Boolean)).join(" ") };
    }
    if (h.startsWith("v-")) {
      const d = state.ddById.get(h.slice(2)); if (!d) return null;
      return { kind: "deze verdieping", title: d.headline, meta: `geschreven ${fmtDate(d.written_at)}`, url: "",
        summary: d.summary, body: (d.sections || []).map((x) => `${x.heading}: ${x.paragraphs.join(" ")}`).join(" ") };
    }
    return null;
  }
  function askOpen(q) {
    const ctx = askContext(); if (!ctx || !q.trim()) return;
    window.open(askUrl(ctx, q.trim()), "_blank", "noopener");
  }
  function askClick(e) {
    const tg = e.target.closest("#ask-toggle");
    if (tg) { const box = $("#ask"), open = box.hidden; box.hidden = !open; tg.setAttribute("aria-expanded", String(open)); if (open) $("#ask-q")?.focus({ preventScroll: true }); return; }
    const chip = e.target.closest("[data-ask]");
    if (chip) askOpen(chip.dataset.ask);
  }

  function fbBlock(a) {
    const mine = fb.get(a.id);
    const reasons = mine ? (mine.v === 1 ? FB_UP : FB_DOWN) : null;
    return `<div class="fb-btns">
        <button type="button" data-vote="1" aria-pressed="${mine?.v === 1}" aria-label="Nuttig" title="Nuttig">👍</button>
        <button type="button" data-vote="-1" aria-pressed="${mine?.v === -1}" aria-label="Niet voor mij" title="Niet voor mij">👎</button>
      </div>

  // Feedback per onderwerp of bron, in punten ten opzichte van het gemiddelde artikel
  function fbLean() {

      ...Object.entries(f.sources || {}).map(([id, v]) => ({ key: "s:" + id, name: source(id).name, pts: Math.round((v - o) * W) })),

  // Wat de radar over je leerde, in een paar zinnen
  function fbLearned(lean) {
    const lc = (s) => s.charAt(0).toLowerCase() + s.slice(1);

    const kinds = lean.filter((x) => x.key.startsWith("k:")), topics = lean.filter((x) => x.key.startsWith("t:")), srcs = lean.filter((x) => x.key.startsWith("s:"));

    const kUp = kinds.filter((x) => x.pts > 0), kDown = kinds.filter((x) => x.pts < 0);
    if (kUp.length) out.push(`Je waardeert <b>${esc(lc(kUp[0].name))}</b> het meest${kDown.length ? `, <b>${esc(lc(kDown[kDown.length - 1].name))}</b> het minst` : ""}.`);
    const tUp = topics.filter((x) => x.pts > 0).slice(0, 2).map((x) => `<b>${esc(x.name)}</b>`);
    if (tUp.length) out.push(`Sterkst bij ${and(tUp)}.`);
    const down = [...topics, ...srcs].filter((x) => x.pts < 0).slice(-2).map((x) => `<b>${esc(x.name)}</b>`);
    if (down.length) out.push(`Minder bij ${and(down)}.`);

  // "Hoger door je 👍 op X" / "Lager door ... Y": welke onderwerpen en bron van dit artikel de feedback bepaalden

    const by = [...(a.topics || []).slice(0, 2).map((t) => lean.get("t:" + t)), lean.get("s:" + a.source_id)]
      .filter((x) => x && Math.sign(x.pts) === Math.sign(pts)).map((x) => `<b>${esc(x.name)}</b>`);
    const list = by.length > 1 ? by.slice(0, -1).join(", ") + " en " + by[by.length - 1] : by[0];
    return pts > 0 ? `${pts} punten hoger: je waardeert ${list || "dit soort artikelen"} meer dan gemiddeld.`
      : `${-pts} punten lager: je waardeert ${list || "dit soort artikelen"} minder dan gemiddeld.`;

  // Status: werkt alles, wat deed de nachtrun, welke bronnen hebben een probleem, wat viel net buiten de feed.
  function nightRun() {
    const f = state.feed, t = (x) => Date.parse(x || "") || 0;
    const times = [...f.articles.map((a) => t(a.processed_at)), ...(f.deepdives || []).map((d) => t(d.written_at))].filter(Boolean);
    if (!times.length) return null;
    const last = Math.max(...times), win = 3 * 3600e3;   // alles binnen 3 uur voor de laatste uitleg = dezelfde run
    return { at: last, articles: f.articles.filter((a) => last - t(a.processed_at) < win).length,
      deepdives: (f.deepdives || []).filter((d) => last - t(d.written_at) < win).length };
  }
  // Per nachttaak (data/runs, pipeline/runs.py): wat deed hij en lukte het
  function runTasks() {

    const day = new Date(r.date + "T12:00:00Z").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "short", timeZone: "UTC" });
    const rows = Object.keys(names).filter((t) => r.tasks[t] || t !== "inhalen").map((t) => {
      const x = r.tasks[t];
      return `<li class="run ${x ? esc(x.status) : "none"}"><b>${x ? icon[x.status] || "?" : "–"} ${names[t]}</b><span>${x ? esc(x.summary) : "niet gedraaid"}${x?.problems?.length ? ` · ${esc(x.problems.join("; "))}` : ""}</span></li>`;
    }).join("");
    return `<section class="block"><h2>Nachttaken, ${esc(day)}</h2><ul class="runs">${rows}</ul></section>`;
  }
  function renderReport() {
    const f = state.feed, q = f.quality_report || {}, run = nightRun();
    const bad = f.sources.filter((s) => s.status !== "ok" && s.status !== "skipped");
    const stale = !run || Date.now() - run.at > 30 * 3600e3;   // langer dan 30 uur geen uitleg = nachtrun gemist
    const failed = f.mode === "failed" || f.mode === "stale";
    const color = failed ? "var(--bad)" : stale || bad.length ? "var(--warn)" : "var(--ok)";
    const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
    const head = failed ? `<strong>Ophalen mislukt.</strong> ${esc(f.mode_note || "")}`

      : `<strong>${bad.length ? `${plural(bad.length, "bron gaf", "bronnen gaven")} niets` : "Alles werkt."}</strong> Laatste nachtrun ${esc(fmtDateTime(new Date(run.at).toISOString()))}: ${plural(run.articles, "artikel", "artikelen")} uitgelegd${run.deepdives ? `, ${plural(run.deepdives, "verdieping", "verdiepingen")} geschreven` : ""}.`;

      </div>`);
  }


  /* ---- Navigatie (#a-<id> en #feedcontrole) ---- */

      fbClick(e); quizClick(e); askClick(e);

  $("#content").addEventListener("click", (e) => { const el = e.target.closest("[data-id],[data-dd]"); if (el) openCard(el); });
  $("#content").addEventListener("click", (e) => {
    const done = e.target.closest("[data-later-done]");
    if (done) { later.remove(done.dataset.laterDone); renderList(); return; }
    const pick = e.target.closest("[data-later-pick]");
    if (pick) { state.chosen = [...(state.chosen || []), pick.dataset.laterPick]; setTimeout(renderList, 300); }
  });
  // Jouw week wegvegen (opzij schuiven) of op × tikken
  function weekGone(bar, dir) {
    store.set("weekGone", bar.dataset.week);
    bar.style.transform = `translateX(${dir * 110}%)`; bar.classList.add("gone");
    setTimeout(() => bar.remove(), 220);
  }
  let swipe = null;
  $("#content").addEventListener("touchstart", (e) => {
    const bar = e.target.closest("#week-bar"); if (!bar) return;
    swipe = { bar, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, moved: false };
  }, { passive: true });
  $("#content").addEventListener("touchmove", (e) => {
    if (!swipe) return;
    swipe.dx = e.touches[0].clientX - swipe.x;
    if (Math.abs(swipe.dx) > 10 && Math.abs(swipe.dx) > Math.abs(e.touches[0].clientY - swipe.y)) {
      swipe.moved = true; swipe.bar.style.transition = "none";
      swipe.bar.style.transform = `translateX(${swipe.dx}px)`; swipe.bar.style.opacity = String(1 - Math.min(Math.abs(swipe.dx) / 300, .7));
    }
  }, { passive: true });
  $("#content").addEventListener("touchend", () => {
    if (!swipe) return;
    const { bar, dx, moved } = swipe; swipe = null;
    bar.style.transition = "";
    if (moved && Math.abs(dx) > 90) { weekGone(bar, Math.sign(dx)); bar.dataset.swiped = "1"; }
    else { bar.style.transform = ""; bar.style.opacity = ""; if (moved) bar.dataset.swiped = "1"; }
  });
  $("#content").addEventListener("click", (e) => {
    const bar = e.target.closest("#week-bar"); if (!bar) return;
    if (bar.dataset.swiped) { e.preventDefault(); e.stopPropagation(); delete bar.dataset.swiped; return; }   // na vegen niet ook openen
    if (e.target.closest(".week-x")) { e.preventDefault(); e.stopPropagation(); weekGone(bar, 1); }
  }, true);
  $("#content").addEventListener("input", (e) => {
    if (e.target.id !== "gl-q") return;
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".gl-item").forEach((el) => { el.hidden = !!q && !el.dataset.k.includes(q); });
  });
  $("#content").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card")) { e.preventDefault(); openCard(e.target); } });
  $("#seg-view").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; store.set("view", state.view); renderSeg(); renderList(); window.scrollTo(0, 0); });
  $("#seg-dd").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.ddTab = b.dataset.v; store.set("ddTab", state.ddTab); renderSeg(); renderList(); window.scrollTo(0, 0); });
  $("#seg-sort").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.sort = b.dataset.v; store.set("sort", state.sort); renderSeg(); renderList(); });
  // Menu (tandwiel): Begrippen en Feedcontrole, onderin als paneel
  const menu = $("#menu-sheet"), menuBtn = $("#btn-menu");
  const menuOpen = (on) => { menu.hidden = !on; $("#menu-backdrop").hidden = !on; menuBtn.setAttribute("aria-expanded", String(on)); };
  menuBtn.addEventListener("click", (e) => { e.stopPropagation(); menuOpen(menu.hidden); });
  menu.addEventListener("click", (e) => { if (e.target.closest("a")) { state.cameFromList = true; menuOpen(false); } });
  // Tik buiten het menu: alleen sluiten, niet ook iets eronder openen.
  document.addEventListener("click", (e) => {
    if (menu.hidden || e.target.closest("#menu-sheet") || e.target.closest("#btn-menu")) return;
    e.preventDefault(); e.stopPropagation(); menuOpen(false);
  }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) menuOpen(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#reader").hidden && !document.querySelector("dialog[open]")) location.hash = ""; });

  load();
})();
</script>
