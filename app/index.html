<title>Data &amp; AI Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: één leeskolom van max. 680px, kleverige kop met filters, artikel opent als volledig scherm. */
:root {
  /* Eén donker thema, dag en nacht. Blauw = primaire kleur (links, knoppen),
     oranje = secundaire kleur (accenten, labels; dezelfde kleur als de relevantie). */
  --bg: #0f1217;
  --surface: #171b22;
  --ink: #e7eaf0;
  --muted: #9aa3b2;
  --line: #2a303a;
  --accent: #9badff;
  --accent-soft: #232b4a;
  --accent2: #f0b04a;
  --accent2-soft: #3a2c14;
  --signal: #f0b04a;
  --signal-off: #333a46;
  --ok: #6fd3a0; --ok-soft: #173326;
  --warn: #f0c060; --warn-soft: #3a2f16;
  --bad: #ff9a90; --bad-soft: #3d1d1b;
  --info: #c3cad6; --info-soft: #252b35;
  --f-display: "Bricolage Grotesque", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-meta: "IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-display); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Kop */
header.top { background: var(--bg); }
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: 8px; }
.brand { display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; }
.mark { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-size: 1.32rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.brand p { margin: 3px 0 0; font-size: 0.82rem; color: var(--muted); }
.brand p .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.brand p strong { color: var(--ink); font-weight: 600; }
.views { display: flex; gap: 22px; margin: 0 2px 8px; }
.views button { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 1rem; font-weight: 650; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.views button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent2); }
.tabs[hidden] { display: none !important; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin-bottom: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.tabs button { border: 0; background: none; height: 38px; border-radius: 9px; font-size: 0.95rem; cursor: pointer; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 650; }
.brand .grow { flex: 1; min-width: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 19px; height: 19px; }
.search { display: flex; gap: 8px; padding-bottom: 10px; }
.search input { flex: 1; min-width: 0; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font: inherit; font-size: 1rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.88rem; font-weight: 500; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip .n { font-family: var(--f-meta); font-size: 0.72rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.controls { display: flex; gap: 8px; justify-content: space-between; padding-bottom: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 11px; font-size: 0.8rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

/* Status van de feed */
.status { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 6px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-size: 0.86rem; color: var(--muted); }
.status[hidden] { display: none; }
.status strong { color: var(--ink); font-weight: 650; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
.status a { white-space: nowrap; }

/* Lijsten */
main { padding-bottom: 64px; }
h2.sec { font-size: 0.74rem; font-family: var(--f-meta); font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 26px 0 10px; display: flex; justify-content: space-between; gap: 8px; }
.top5 { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.top5 li + li { border-top: 1px solid var(--line); }
.top5 button { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 13px 14px; cursor: pointer; }
.top5 .rank { font-family: var(--f-meta); font-size: 0.8rem; color: var(--signal); padding-top: 2px; }
.top5 .t { display: block; font-weight: 650; font-size: 0.98rem; line-height: 1.3; text-wrap: balance; }
.top5 .m { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.cards { margin-top: 14px; display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 15px 13px; cursor: pointer; display: grid; gap: 8px; min-width: 0; }
.card:hover { border-color: color-mix(in srgb, var(--accent2) 45%, var(--line)); }
.meta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-meta); font-size: 0.76rem; color: var(--muted); align-items: center; }
.meta .src { color: var(--ink); font-weight: 500; }
.card h3 { margin: 0; font-size: 1.12rem; line-height: 1.28; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.card .sum { margin: 0; font-family: var(--f-read); font-size: 0.95rem; line-height: 1.55; color: var(--ink); }
.card .why { margin: 0; font-size: 0.86rem; color: var(--muted); line-height: 1.45; }
.card .why b { color: var(--accent2); font-weight: 650; }
.fb-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fb-btns button, .fb-reasons button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 0 14px; height: 40px; font-size: 0.9rem; cursor: pointer; }
.fb-btns button[aria-pressed="true"] { border-color: var(--accent2); background: var(--accent2-soft); color: var(--accent2); font-weight: 650; }
.fb-reasons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.fb-reasons button { height: 34px; font-size: 0.82rem; color: var(--muted); }
.fb-reasons button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.fb-note { margin: 10px 0 0; font-size: 0.82rem; color: var(--muted); }
.fb-send { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 14px; min-height: 44px; border-radius: var(--r); border: 1px solid var(--accent2); background: var(--accent2-soft); color: var(--ink); text-decoration: none; font-size: 0.9rem; }
.fb-send b { color: var(--accent2); }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-decoration: underline dotted var(--muted); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.term.new { color: var(--accent2); text-decoration-color: var(--accent2); }   /* nog niet bekeken */
.term-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--accent2); padding: 16px 20px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
.term-sheet[hidden] { display: none; }
.term-sheet .wrap { position: relative; }
.term-sheet h3 { margin: 0 32px 6px 0; font-size: 1.05rem; color: var(--accent2); }
.term-sheet p { margin: 0 0 10px; font-family: var(--f-read); line-height: 1.6; }
.term-sheet a { color: var(--accent2); font-size: 0.9rem; }
.term-sheet .x { position: absolute; top: -6px; right: 0; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
.gl-filter { width: 100%; margin-top: 14px; height: 44px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.gloss { margin: 14px 0 0; display: grid; gap: 10px; }
.gl-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.gl-item[hidden] { display: none; }
.gl-item dt { font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
.gl-item dd { margin: 0; font-family: var(--f-read); line-height: 1.6; }
.gl-refs { display: block; margin-top: 6px; font-family: var(--f-meta); font-size: 0.78rem; color: var(--muted); }
.gl-refs a { color: var(--muted); }
.wk-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 14px; }
.wk-list li { border-left: 3px solid var(--accent2); padding: 2px 0 2px 12px; }
.wk-list h3 { margin: 0 0 4px; font-size: 1rem; line-height: 1.35; }
.wk-list p { margin: 0 0 4px; font-family: var(--f-read); line-height: 1.6; }
.wk-links { display: flex; flex-direction: column; gap: 2px; font-size: 0.88rem; }
.wk-links a, .wk-stats a { color: var(--accent2); }
.wk-stats { list-style: none; padding: 0 !important; margin: 6px 0 0 !important; display: grid; gap: 6px; font-size: 0.95rem; }
.wk-stats b { font-variant-numeric: tabular-nums; }
.trend { cursor: default; margin-top: 14px; }
.trend .meta .src { color: var(--accent2); }
.trend-list { list-style: none; margin: 4px 0 0; padding: 0; border-top: 1px solid var(--line); }
.trend-list button { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; color: var(--ink); min-height: 44px; }
.trend-list li:last-child button { border-bottom: 0; }
.trend-list .t { font-weight: 550; font-size: 0.95rem; }
.trend-list .m { color: var(--muted); font-size: 0.74rem; font-family: var(--f-meta); }
.quiz, .fb { font-family: var(--f-display); }
.q-list { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 18px; }
.q-from { margin: 0 0 4px; font-family: var(--f-meta); font-size: 0.72rem; color: var(--muted); }
.q-text { margin: 0 0 8px; font-weight: 600; line-height: 1.4; }
.q-opts { display: grid; gap: 6px; }
.q-opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; min-height: 44px; font-size: 0.92rem; cursor: pointer; line-height: 1.35; }
.q-opts button:disabled { cursor: default; opacity: .7; }
.q-opts button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); opacity: 1; }
.q-opts button.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); opacity: 1; }
.q-exp { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
.q-exp b { color: var(--ink); }
.ask-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.ask-chips button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 0 12px; height: 36px; font-size: 0.84rem; cursor: pointer; }
.ask-form { display: grid; gap: 8px; }
.ask-form textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 1rem; resize: vertical; min-height: 48px; }
.ask-form .btn { justify-self: start; }
.ask { font-family: var(--f-display); }
.show, .show p { font-family: var(--f-display); }
.show-cap { margin: 0 0 10px; font-size: 0.95rem; line-height: 1.5; }
.show-arrow { margin: 10px 0 6px; font-family: var(--f-meta); font-size: 0.7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent2); }
pre.code { margin: 0; padding: 12px 14px; background: #0b0e12; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; font-family: var(--f-meta); font-size: 0.8rem; line-height: 1.55; color: #d6dbe4; white-space: pre; }
.res-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.res { border-collapse: collapse; width: 100%; font-family: var(--f-meta); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
table.res th, table.res td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.res th { color: var(--muted); font-weight: 500; background: var(--surface); }
table.res tr:last-child td { border-bottom: 0; }
#leren { width: 100%; }
.leren-frame { display: block; width: 100%; height: 85vh; border: 0; background: var(--bg); color-scheme: dark; }
a.card.opt { text-decoration: none; color: inherit; }
article.card.opt.chosen { cursor: default; border-color: var(--accent2); }
.pick-note { margin: 14px 2px 0; font-size: 0.86rem; color: var(--muted); line-height: 1.45; }
.pick-note b { color: var(--ink); font-weight: 650; }
.card .card-date { font-family: var(--f-meta); font-size: 0.66rem; font-weight: 400; color: var(--muted); margin-right: 8px; }
.card .raw { margin: 0; font-size: 0.84rem; color: var(--muted); font-style: italic; font-family: var(--f-read); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.74rem; padding: 3px 8px; border-radius: 6px; background: var(--info-soft); color: var(--info); }
.pill { font-family: var(--f-meta); font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; text-transform: lowercase; }
.pill.beschikbaar { background: var(--ok-soft); color: var(--ok); }
.pill.preview, .pill.experimenteel { background: var(--warn-soft); color: var(--warn); }
.pill.aangekondigd, .pill.onbekend { background: var(--info-soft); color: var(--info); }
.pill.rawp { background: var(--info-soft); color: var(--muted); }
.pill.opinie { background: var(--accent2-soft); color: var(--accent2); }
.signal { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-meta); font-size: 0.74rem; color: var(--muted); }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.bars i { width: 4px; border-radius: 1px; background: var(--signal-off); }
.bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 9px; } .bars i:nth-child(4) { height: 11px; } .bars i:nth-child(5) { height: 14px; }
.bars i.on { background: var(--signal); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 1.05rem; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); font-weight: 650; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.skel { height: 132px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.4s infinite linear; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

/* Artikelweergave */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
.reader .bar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.reader .bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.reader .bar .crumb { font-family: var(--f-meta); font-size: 0.74rem; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
article.full { padding-block: 22px 60px; }
article.full h1 { font-size: clamp(1.5rem, 5.6vw, 2.05rem); line-height: 1.15; letter-spacing: -0.02em; font-weight: 750; margin: 10px 0 14px; text-wrap: balance; overflow-wrap: anywhere; }
.lead { font-family: var(--f-read); font-size: 1.1rem; line-height: 1.6; margin: 0 0 8px; }
.block { margin-top: 26px; }
.block h2 { font-size: 1.05rem; margin: 0 0 6px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kind { font-family: var(--f-meta); font-size: 0.66rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px; }
.kind.bron { background: var(--ok-soft); color: var(--ok); }
.kind.uitleg { background: var(--accent-soft); color: var(--accent); }
.kind.idee { background: var(--warn-soft); color: var(--warn); }
.block p, .block li { font-family: var(--f-read); font-size: 1.02rem; line-height: 1.68; }
.block p { margin: 0; max-width: 64ch; }
.block ul { margin: 6px 0 0; padding-left: 1.2em; max-width: 64ch; }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.orig { margin: -6px 0 18px; font-size: 0.8rem; color: var(--muted); font-family: var(--f-meta); overflow-wrap: anywhere; }
.story p { font-family: var(--f-read); font-size: 1.06rem; line-height: 1.72; margin: 0 0 1.05em; max-width: 64ch; }
.story p:first-child { font-size: 1.14rem; }
.try { margin-top: 26px; background: var(--accent2-soft); border-radius: var(--r); padding: 16px 18px; }
.try h2 { margin: 0 0 6px; font-size: 1rem; color: var(--accent2); }
.try p { margin: 0; font-family: var(--f-read); font-size: 1rem; line-height: 1.65; }
.source { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.source dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 0.86rem; }
.source dt { color: var(--muted); font-family: var(--f-meta); font-size: 0.74rem; padding-top: 2px; }
.source dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.note { font-size: 0.84rem; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; }
.meta.top { flex-wrap: wrap; justify-content: flex-start; gap: 6px 14px; }
.meta.top .score-btn { margin-left: auto; }
.score-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; cursor: pointer; }
.score-btn:hover, .score-btn:focus-visible { border-color: var(--accent); }
.score-btn .info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 0.66rem; font-weight: 700; font-style: italic; }
.score-dlg { width: min(420px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.score-dlg::backdrop { background: rgba(0,0,0,.35); }
.score-dlg h2 { margin: 0 0 10px; font-size: 1rem; }
.score-dlg .score-note { font-size: .8rem; color: var(--muted); margin: 10px 0 12px; }
.score-dlg form { display: flex; justify-content: flex-end; margin: 0; }
.pill.verdieping { background: var(--accent2-soft); color: var(--accent2); }
.dd-sec h2 { font-size: 1.15rem; margin: 30px 0 8px; font-weight: 650; }
.reading { margin: 6px 0 0; padding-left: 1.2em; max-width: 64ch; }
.reading li { font-size: 0.95rem; line-height: 1.55; margin-bottom: 8px; }
.reading .why { display: block; color: var(--muted); font-size: 0.85rem; }
.score-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; font-variant-numeric: tabular-nums; }
.score-table td { padding: 6px 0; border-top: 1px solid var(--line); }
.score-table td:last-child { text-align: right; font-family: var(--f-meta); }
.meter { height: 6px; border-radius: 3px; background: var(--signal-off); overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.meter > span { display: block; height: 100%; background: var(--signal); }

/* Feedcontrole */
.report h1 { font-size: 1.6rem; margin: 12px 0 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.82rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { border-top: 0; font-family: var(--f-meta); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.st { font-family: var(--f-meta); font-size: 0.7rem; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.st.ok { background: var(--ok-soft); color: var(--ok); }
.st.failed { background: var(--bad-soft); color: var(--bad); }
.st.not_supported, .st.skipped, .st.not_fetched { background: var(--info-soft); color: var(--info); }
.report p { max-width: 64ch; }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } * { scroll-behavior: auto !important; } }
@media (min-width: 760px) { .card { padding: 18px 20px 16px; } .brand { padding-top: 20px; } }
</style>

<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
        <!-- Zelfde ontwerp als het app-icoon (scripts/make_icons.py): variant B 'Signaal' -->
        <path d="M17 17 L17 2 A15 15 0 0 1 31.1 11.9 Z" fill="var(--accent2)"/>
        <circle cx="17" cy="17" r="15" fill="none" stroke="#c4cbd6" stroke-width="1.8"/>
        <circle cx="17" cy="17" r="8.25" fill="none" stroke="#808998" stroke-width="1.8"/>
        <circle cx="23.2" cy="8.15" r="2.1" fill="var(--ink)"/>
        <circle cx="17" cy="17" r="1.8" fill="var(--ink)"/>
      </svg>
      <div class="grow">
        <h1>Data &amp; AI Radar</h1>
        <p class="upd" id="upd">Feed laden…</p>
      </div>
      <button class="icon-btn" id="btn-report" type="button" aria-label="Feedcontrole openen" title="Feedcontrole">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 16V9M8 16V4M13 16v-5M18 16V7"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="filters">
  <div class="wrap">
    <div class="views" role="tablist" aria-label="Weergave" id="seg-view">
      <button type="button" role="tab" data-v="actueel">Actueel</button><button type="button" role="tab" data-v="verdieping">Verdieping</button><button type="button" role="tab" data-v="leren">Leren</button>
    </div>
    <div class="tabs" role="group" aria-label="Sortering" id="seg-sort">
      <button type="button" data-v="date">Nieuw</button><button type="button" data-v="score">Relevant</button><button type="button" data-v="trends">Trends</button>
    </div>
    <div class="tabs" role="group" aria-label="Verdiepingen" id="seg-dd" hidden>
      <button type="button" data-v="alle">Verdiepingen</button><button type="button" data-v="morgen">Morgen</button><button type="button" data-v="begrippen">Begrippen</button>
    </div>
  </div>
</div>

<main class="wrap" id="main">
  <div class="status" id="status" hidden></div>
  <div id="content"><div class="cards"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>

<!-- Leren: het Claude-examen (app/leren/) als eigen pagina in een venster. Losse code, opmaak en opslag. -->
<div id="leren" hidden></div>

<div class="reader" id="reader" hidden></div>

<script>
(() => {
  /* ---- Bron van artikeldata ----
     De app leest alleen feed.json (gemaakt door de pipeline). Komen artikelen later
     uit een GitHub-repository, dan maakt de pipeline nog steeds dit bestand en
     verandert hier niets. */
  const FEED_URL = "feed.json";
  const SUPPORTED_SCHEMA = 1;

  const state = { feed: null, view: "actueel", ddTab: "alle", ddById: new Map(), group: "all", period: "all", sort: "score", q: "", byId: new Map(), scrollY: 0 };
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("radar:" + k); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("radar:" + k, v); } catch {} },
  };

  /* ---- Duimpjes ----
     Bewaard op dit toestel (radar:fb). Versturen = één GitHub-issue "Feedback: ..." met een
     JSON-blok; GitHub Actions verwerkt het direct (scripts/collect_feedback.py). */
  const FB_UP = { meer_hiervan: "Meer hiervan" };
  const FB_DOWN = { te_basic: "Te basic", niet_mijn_stack: "Niet mijn stack", oud_nieuws: "Oud nieuws", te_vaag: "Te vaag", geen_interesse: "Interesseert me niet" };
  const fb = {
    all() { try { return JSON.parse(localStorage.getItem("radar:fb") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:fb", JSON.stringify(d)); } catch {} },
    get(id) { return this.all()[id]; },
    set(id, v) { const d = this.all(); if (v) d[id] = v; else delete d[id]; this.save(d); },
    pending() { return Object.entries(this.all()).filter(([, v]) => !v.sent); },
  };
  /* ---- Gelezen ----
     Een artikel of verdieping telt als gelezen als je tot onderaan scrolt en het minstens
     15 seconden open had. Bewaard op dit toestel (radar:read). Gelezen artikelen gaan mee met
     je feedback als licht signaal (0,5; een duim omhoog telt 2). */
  const READ_MS = window.__radarReadMs || 15000;   // __radarReadMs alleen voor de tests
  const reads = {
    all() { try { return JSON.parse(localStorage.getItem("radar:read") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:read", JSON.stringify(d)); } catch {} },
    mark(key) { const d = this.all(); if (d[key]) return; d[key] = { at: new Date().toISOString(), sent: false }; this.save(d); },
    pendingArticles() { return Object.entries(this.all()).filter(([k, v]) => k.startsWith("a-") && !v.sent).map(([k]) => k.slice(2)); },
    since(ms) { return Object.entries(this.all()).filter(([, v]) => Date.parse(v.at) >= ms).map(([k]) => k); },
  };
  let readTimer = null, readObs = null;
  function trackRead(key) {
    clearTimeout(readTimer); readObs?.disconnect();
    const end = $("#reader .read-end"); if (!end || reads.all()[key]) return;
    const t0 = Date.now();
    readObs = new IntersectionObserver((es) => {
      if (!es.some((e) => e.isIntersecting)) return;
      readObs.disconnect();
      readTimer = setTimeout(() => { if (location.hash === "#" + key) reads.mark(key); }, Math.max(0, READ_MS - (Date.now() - t0)));
    });
    readObs.observe(end);
  }
  const TZ = "Europe/Amsterdam";
  const dateOnly = (iso) => /T00:00:00(\.000)?Z$/.test(iso);
  function fmtDate(iso) {
    if (!iso) return "datum onbekend";
    const d = new Date(iso);
    return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric", timeZone: dateOnly(iso) ? "UTC" : TZ });
  }
  function fmtDateTime(iso) {
    if (!iso) return "onbekend";
    return new Date(iso).toLocaleString("nl-NL", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ });
  }
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  const TYPE_LABEL = { official_docs: "Officieel", vendor_blog: "Leverancier", expert_blog: "Vakmens", technical_article: "Technisch", independent_news: "Onafhankelijk" };
  const SRC_STATUS = { ok: "werkt", failed: "mislukt", not_supported: "niet ondersteund", skipped: "handmatig", not_fetched: "niet opgehaald" };
  const MODE = {
    live: { label: "Live", color: "var(--ok)", text: "Alle feeds zijn opgehaald." },
    partial: { label: "Gedeeltelijk live", color: "var(--warn)", text: "Niet alle bronnen konden worden opgehaald." },
    snapshot: { label: "Momentopname", color: "var(--warn)", text: "" },
    demo: { label: "Demonstratiedata", color: "var(--bad)", text: "Geen echt nieuws: alleen om de app te testen." },
    stale: { label: "Verouderd", color: "var(--bad)", text: "Ophalen mislukt; je ziet de vorige feed." },
  };

  const source = (id) => state.feed.sources.find((s) => s.id === id) || { name: id, type: "" };
  const groupLabel = (id) => (state.feed.groups.find((g) => g.id === id) || { label: id }).label;
  const firstSentence = (t) => (String(t || "").match(/^.*?[.!?](\s|$)/) || [t])[0].trim();

  function bars(score) {
    const n = Math.max(1, Math.min(5, Math.ceil((score || 0) / 20)));
    return `<span class="signal" title="Relevantie ${score} van 100"><span class="bars" aria-hidden="true">${[1,2,3,4,5].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>${score}</span>`;
  }

  /* ---- Laden ---- */
  async function load() {
    try {
      const res = await fetch(FEED_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`het bestand gaf status ${res.status}`);
      const feed = await res.json();
      if (feed.schema_version !== SUPPORTED_SCHEMA) throw new Error(`onbekende feedversie ${feed.schema_version}`);
      if (!Array.isArray(feed.articles)) throw new Error("het bestand bevat geen artikellijst");
      state.feed = feed;
      feed.articles.forEach((a) => state.byId.set(a.id, a));
      (feed.deepdives || []).forEach((d) => state.ddById.set(d.id, d));
      state.sort = store.get("sort", "score");
      state.view = ["verdieping", "leren"].includes(store.get("view", "actueel")) ? store.get("view", "actueel") : "actueel";
      state.ddTab = ["morgen", "begrippen"].includes(store.get("ddTab", "alle")) ? store.get("ddTab", "alle") : "alle";
      renderStatus();
      renderSeg();
      route();
    } catch (e) {
      $("#upd").textContent = "Niet geladen";
      $("#status").hidden = false;
      $("#status").innerHTML = `<span class="dot" style="background:var(--bad)"></span><span><strong>De feed kon niet worden geladen.</strong> ${esc(e.message)}. Controleer of feed.json naast de app staat.</span>`;
      $("#content").innerHTML = `<div class="empty"><h3>Geen artikelen beschikbaar</h3><p>De app vindt geen leesbare feed. Probeer het opnieuw.</p><button class="btn" type="button" id="retry">Opnieuw laden</button></div>`;
      $("#retry").onclick = () => location.reload();
    }
  }

  function renderStatus() {
    const f = state.feed, m = MODE[f.mode] || MODE.partial;
    const ok = f.sources.filter((s) => s.status === "ok").length;
    const fine = f.mode === "live" && ok === f.sources.length;
    $("#upd").innerHTML = `<span class="dot" style="background:${m.color}"></span>Nieuwe artikelen <strong>${esc(fmtDateTime(newestAdded(f) || f.last_article_added_at || f.last_successful_update || f.generated_at))}</strong>`;
    const st = $("#status");
    st.hidden = fine;
    if (!fine) {
      const text = f.mode === "snapshot" ? `Momentopname uit ${ok} bronnen; wordt niet automatisch ververst.` : `${m.text} ${ok} van ${f.sources.length} bronnen leverden artikelen.`;
      st.innerHTML = `<span class="dot" style="background:${m.color}"></span><span><strong>${esc(m.label)}</strong><br>${esc(text)} <a href="#feedcontrole">Feedcontrole</a></span>`;
    }
  }

  /* ---- Filters ---- */
  function inPeriod(a) {
    if (state.period === "all") return true;
    if (!a.published_at) return false;
    const ref = Date.parse(state.feed.last_successful_update || state.feed.generated_at);
    const days = state.period === "week" ? 7 : 31;
    return ref - Date.parse(a.published_at) <= days * 864e5;
  }
  function matches(a) {
    if (fb.get(a.id)?.v === -1) return false;   // duim omlaag: weg uit je lijst
    if (state.group !== "all" && !(a.groups || []).includes(state.group)) return false;
    if (!inPeriod(a)) return false;
    if (state.q) {
      const hay = norm([a.headline, a.title, a.summary, a.excerpt, source(a.source_id).name, ...(a.topics || []).map((t) => state.feed.topics[t]?.name)].join(" "));
      if (!norm(state.q).split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }
  function sorted(list) {
    const l = [...list];
    // "Nieuw" = nieuw in de radar: wanneer Claude het uitlegde, anders wanneer het werd opgehaald.
    const t = (iso) => (iso ? Date.parse(iso) || 0 : 0);
    const added = (a) => t(a.processed_at) || t(a.fetched_at) || t(a.published_at);
    if (state.sort === "date") l.sort((a, b) => added(b) - added(a) || t(b.published_at) - t(a.published_at));
    else l.sort((a, b) => b.relevance_score - a.relevance_score || (b.published_at || "").localeCompare(a.published_at || ""));
    return l;
  }

  function renderSeg() {
    document.querySelectorAll("#seg-sort button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.sort));
    document.querySelectorAll("#seg-view button").forEach((b) => b.setAttribute("aria-selected", b.dataset.v === state.view));
    $("#seg-sort").hidden = state.view !== "actueel";
    $("#upd").hidden = state.view !== "actueel";   // "Nieuwe artikelen <datum>" hoort alleen bij Actueel
    $("#seg-dd").hidden = state.view !== "verdieping";
    document.querySelectorAll("#seg-dd button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.ddTab));
  }

  /* ---- Lijst ---- */
  // Datum waarop het artikel in de app kwam (uitgelegd, anders opgehaald), kort als 29-10.
  const addedAt = (a) => a.processed_at || a.fetched_at || a.published_at;
  const shortDate = (iso) => new Date(iso).toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit", timeZone: TZ });
  // Datum-tijd van het nieuwste artikel in de app.
  const newestAdded = (f) => [...(f.articles || []).map(addedAt), ...(f.deepdives || []).map((d) => d.written_at)].filter(Boolean).sort((x, y) => Date.parse(y) - Date.parse(x))[0];
  function card(a) {
    const s = source(a.source_id);
    const body = a.processing_status === "enriched" ? a.summary : a.excerpt;
    return `<article class="card" data-id="${esc(a.id)}" tabindex="0" role="link" aria-label="${esc(a.headline || a.title)}">
      <div class="meta"><span class="src">${addedAt(a) ? `<span class="card-date">${esc(shortDate(addedAt(a)))}</span>` : ""}${esc(s.name)}</span>${a.article_type === "opinie" ? `<span class="pill opinie">opinie</span>` : ""}${bars(a.relevance_score)}</div>
      <h3>${esc(a.headline || a.title)}</h3>
      ${body ? `<p class="sum">${esc(body)}</p>` : ""}
    </article>`;
  }

  function ddCard(d) {
    return `<article class="card" data-dd="${esc(d.id)}" tabindex="0" role="link" aria-label="${esc(d.headline)}">
      <div class="meta"><span class="src"><span class="card-date">${esc(shortDate(d.written_at))}</span>Verdieping</span><span>${d.reading_minutes} min lezen</span></div>
      <h3>${esc(d.headline)}</h3>
      <p class="sum">${esc(d.summary)}</p>
    </article>`;
  }
  /* ---- Keuzes voor de verdieping van morgen ----
     De app is een statische site en kan zelf niets in de repository zetten. Een keuze wordt
     daarom een GitHub-issue "Verdieping: <id>" dat je met één tik aanmaakt. De Claude-taak
     leest dat de volgende ochtend (scripts/next_deepdive.py). Alleen issues van de eigenaar tellen. */
  const AREA_LABEL = { data_engineering: "Data engineering", context_agents: "Context & agents", claude: "Claude", new_tech: "Nieuwe technologie" };
  const repo = () => state.feed.repo || "tomasr91/data-ai-radar";
  function issueUrl(o) {
    const body = `Gekozen in de Data & AI Radar.\n\n**${o.title}**\n\n${o.question}\n\nClaude schrijft deze verdieping bij de volgende ochtendrun en sluit dit issue daarna.`;
    return `https://github.com/${repo()}/issues/new?title=${encodeURIComponent("Verdieping: " + o.id)}&body=${encodeURIComponent(body)}`;
  }
  function optCard(o, chosen) {
    const inner = `<div class="meta"><span class="src">${esc(AREA_LABEL[o.area] || "Verdieping")}</span>${chosen ? `<span class="pill verdieping">morgen</span>` : ""}</div>
      <h3>${esc(o.title)}</h3>
      ${o.question ? `<p class="sum">${esc(o.question)}</p>` : ""}
      ${o.why && !chosen ? `<p class="why">${esc(o.why)}</p>` : ""}`;
    return chosen ? `<article class="card opt chosen" data-opt="${esc(o.id)}">${inner}</article>`
      : `<a class="card opt" href="${esc(issueUrl(o))}" target="_blank" rel="noopener" data-opt="${esc(o.id)}">${inner}</a>`;
  }
  function renderPicker() {
    const o = state.feed.deepdive_options;
    const chosen = state.chosen || [];
    const known = new Map((o?.options || []).map((x) => [x.id, x]));
    if (chosen.length) {
      // Er is gekozen: alleen die keuze, als de verdieping van morgen.
      return `<p class="pick-note">Claude schrijft deze morgenochtend. Daarna krijg je hier weer 5 nieuwe keuzes.</p>
        <div class="cards">${chosen.map((id) => optCard(known.get(id) || { id, title: id }, true)).join("")}</div>`;
    }
    if (!o?.options?.length) return `<div class="empty"><h3>Nog geen keuzes</h3><p>Claude zet morgenochtend 5 onderwerpen klaar.</p></div>`;
    return `<p class="pick-note">Kies het onderwerp voor morgen. GitHub opent; tik daar op <b>Create</b>.</p><div class="cards">${o.options.map((x) => optCard(x)).join("")}</div>`;
  }
  let chosenAt = 0;
  async function loadChosen(force) {
    if (!force && Date.now() - chosenAt < 60e3) return;
    chosenAt = Date.now();
    try {
      const owner = repo().split("/")[0].toLowerCase();
      const res = await fetch(`https://api.github.com/repos/${repo()}/issues?state=open&per_page=50`, { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) return;
      const ids = (await res.json())
        .filter((i) => !i.pull_request && (i.user?.login || "").toLowerCase() === owner)
        .map((i) => (String(i.title).match(/^\s*Verdieping:\s*([a-z0-9-]+)\s*$/i) || [])[1]).filter(Boolean).map((x) => x.toLowerCase());
      if (ids.join() !== (state.chosen || []).join()) { state.chosen = ids; if (state.view === "verdieping" && $("#reader").hidden) renderList(); }
    } catch { /* offline of GitHub niet bereikbaar: keuzes blijven gewoon zichtbaar */ }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.feed && state.view === "verdieping") loadChosen(true); });

  /* ---- Trends: "Dit speelt nu" (data/trends.json, geschreven door de Claude-taak) ---- */
  function renderTrends() {
    const ts = state.feed.trends || [];
    if (!ts.length) return `<div class="empty" style="margin-top:14px"><h3>Nu geen trends</h3><p>Een trend verschijnt als minstens drie artikelen uit verschillende bronnen over dezelfde ontwikkeling gaan. Claude kijkt daar elke ochtend naar.</p></div>`;
    return `<p class="pick-note">Waar meerdere bronnen nu tegelijk over schrijven.</p>` + ts.map((t) => {
      const arts = t.article_ids.map((id) => state.byId.get(id)).filter((a) => a && fb.get(a.id)?.v !== -1);
      const srcs = new Set(arts.map((a) => a.source_id)).size;
      return `<section class="trend card" data-trend="${esc(t.id)}">
        <div class="meta"><span class="src">Dit speelt nu</span><span>${arts.length} artikelen · ${srcs} bronnen</span></div>
        <h3>${esc(t.title)}</h3>
        <p class="sum">${esc(t.summary)}</p>
        <ul class="trend-list">${arts.map((a) => `<li><button type="button" data-id="${esc(a.id)}"><span class="t">${esc(a.headline || a.title)}</span><span class="m">${esc(source(a.source_id).name)}</span></button></li>`).join("")}</ul>
      </section>`;
    }).join("");
  }

  /* ---- Leren ----
     Het examen staat in leren/index.html en draait in een venster (iframe) van dezelfde site.
     Het venster blijft bestaan als je van tabblad wisselt, zodat je midden in een vraag kunt terugkomen.
     De hoogte groeit mee met de inhoud, zodat je gewoon met de pagina scrolt. */
  function showLeren(on) {
    $("#main").hidden = on;
    $("#leren").hidden = !on;
    if (!on || $("#leren-frame")) return;
    const fr = document.createElement("iframe");
    fr.id = "leren-frame"; fr.className = "leren-frame"; fr.title = "Claude-examen oefenen"; fr.src = "leren/index.html";
    fr.addEventListener("load", () => {
      try {
        const d = fr.contentDocument;
        const fit = () => { fr.style.height = Math.max(d.documentElement.scrollHeight, 400) + "px"; };
        new ResizeObserver(fit).observe(d.body); fit();
      } catch { fr.style.height = "85vh"; }
    });
    $("#leren").appendChild(fr);
  }

  function renderList() {
    const f = state.feed;
    showLeren(state.view === "leren");
    if (state.view === "leren") return;
    if (state.view === "verdieping") {
      const dds = [...(f.deepdives || [])].sort((a, b) => Date.parse(b.written_at) - Date.parse(a.written_at));
      $("#content").innerHTML = state.ddTab === "morgen" ? renderPicker() : state.ddTab === "begrippen" ? renderGlossary()
        : dds.length ? reviewBar() + `<div class="cards">${dds.map(ddCard).join("")}</div>`
        : `<div class="empty"><h3>Nog geen verdiepingen</h3><p>Kies bij Morgen een onderwerp. Claude schrijft hem de volgende ochtend.</p></div>`;
      loadChosen();
      return;
    }
    if (state.sort === "trends") { $("#content").innerHTML = renderTrends(); return; }
    const list = sorted(f.articles.filter(matches));
    let html = "";
    if (!list.length) {
      const missing = f.quality_report?.topics_without_source || [];
      const groupMissing = state.group !== "all" && missing.some((t) => f.topics[t]?.group === state.group);
      html += `<div class="empty"><h3>Nog geen artikelen</h3><p>Er zijn nu geen artikelen om te tonen. Kom later terug.</p></div>`;
    } else {
      html += weekBar() + fbSendBar() + `<div class="cards">${list.map(card).join("")}</div>`;
    }
    $("#content").innerHTML = html;
  }

  /* ---- Controlevragen ----
     Antwoorden bewaard op dit toestel (radar:quiz). Fout = na 7 dagen terug als herhaling. */
  const quiz = {
    all() { try { return JSON.parse(localStorage.getItem("radar:quiz") || "{}"); } catch { return {}; } },
    save(d) { try { localStorage.setItem("radar:quiz", JSON.stringify(d)); } catch {} },
    due() {
      const now = Date.now(), d = this.all();
      return Object.entries(d).filter(([, v]) => !v.ok && Date.parse(v.due) <= now).map(([k]) => k);
    },
  };
  const qLookup = (key) => { const [dd, i] = key.split(":"); const d = state.ddById.get(dd); return d?.quiz?.[Number(i)] ? { d, q: d.quiz[Number(i)] } : null; };
  function qItem(key, review) {
    const hit = qLookup(key); if (!hit) return "";
    const { d, q } = hit, rec = quiz.all()[key];
    const answered = rec && (!review || rec.review);
    return `<li class="q" data-q="${esc(key)}" data-review="${review ? 1 : 0}">
      ${review ? `<p class="q-from">${esc(d.headline)}</p>` : ""}
      <p class="q-text">${esc(q.question)}</p>
      <div class="q-opts">${q.options.map((o, i) => `<button type="button" data-opt-i="${i}" ${answered ? "disabled" : ""}
        class="${answered && i === q.answer ? "right" : ""}${answered && rec.pick === i && i !== q.answer ? " wrong" : ""}">${esc(o)}</button>`).join("")}</div>
      ${answered ? `<p class="q-exp"><b>${rec.pick === q.answer ? "Goed." : "Niet goed."}</b> ${esc(q.explanation)}${rec.pick !== q.answer ? " Deze vraag komt over een week terug." : ""}</p>` : ""}
    </li>`;
  }
  function quizBlock(d) {
    if (!d.quiz?.length) return "";
    return `<section class="block quiz"><h2>Test jezelf</h2><ol class="q-list">${d.quiz.map((_, i) => qItem(`${d.id}:${i}`)).join("")}</ol></section>`;
  }
  function quizClick(e) {
    const b = e.target.closest("[data-opt-i]"); if (!b || b.disabled) return;
    const li = b.closest(".q"), key = li.dataset.q, review = li.dataset.review === "1";
    const hit = qLookup(key); if (!hit) return;
    const pick = Number(b.dataset.optI), ok = pick === hit.q.answer, d = quiz.all();
    d[key] = { ok: ok || (d[key]?.ok && !review), pick, at: new Date().toISOString(), due: new Date(Date.now() + 7 * 864e5).toISOString(), review };
    if (review && ok) d[key].ok = true;
    quiz.save(d);
    li.outerHTML = qItem(key, review);
  }
  function reviewBar() {
    const n = quiz.due().filter(qLookup).length;
    return n ? `<a class="fb-send" href="#herhaling"><span>${n} vraag${n === 1 ? "" : "en"} om te herhalen</span><b>Herhalen ›</b></a>` : "";
  }
  function renderReview() {
    const keys = quiz.due().filter(qLookup);
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Herhaling</span></div></div>
      <article class="full wrap"><h1>Herhaling</h1>
      ${keys.length ? `<p class="lead">Deze vragen had je een week geleden niet goed. Lukt het nu?</p><section class="block quiz"><ol class="q-list">${keys.map((k) => { const d = quiz.all(); delete d[k].review; quiz.save(d); return qItem(k, true); }).join("")}</ol></section>`
        : `<p class="lead">Niets te herhalen. Goed bezig.</p>`}</article>`);
  }

  /* ---- Begrippen ----
     Claude zet bij een stuk `terms` (pipeline/terms.py). De eerste keer dat een begrip in de tekst
     staat wordt het onderstreept; tik erop voor de uitleg. Alle begrippen: Verdieping > Begrippen. */
  const reEsc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // Begrippen die je al eens aantikte: niet meer oranje, alleen nog gestippeld (radar:terms).
  const termsSeen = {
    all() { try { return JSON.parse(localStorage.getItem("radar:terms") || "{}"); } catch { return {}; } },
    has(t) { return !!this.all()[t.trim().toLowerCase()]; },
    add(t) { const d = this.all(); d[t.trim().toLowerCase()] = new Date().toISOString(); try { localStorage.setItem("radar:terms", JSON.stringify(d)); } catch {} },
  };
  function termMarker(terms) {
    const todo = (terms || []).filter((t) => t?.term).sort((a, b) => b.term.length - a.term.length)
      .map((t) => ({ t, re: new RegExp(`(?<![\\p{L}\\p{N}_])${reEsc(esc(t.term.trim()))}(?![\\p{L}\\p{N}_])`, "iu") }));
    const done = new Set();
    return (text) => {
      let h = esc(text);
      for (const x of todo) {
        if (done.has(x)) continue;
        const m = h.match(x.re); if (!m) continue;
        const before = h.slice(0, m.index);
        if (before.lastIndexOf("<") > before.lastIndexOf(">")) continue;   // niet binnen een tag
        if ((before.match(/<button/g) || []).length !== (before.match(/<\/button>/g) || []).length) continue;   // niet binnen een ander begrip
        h = before + `<button type="button" class="term${termsSeen.has(x.t.term) ? "" : " new"}" data-term="${esc(x.t.term)}" data-exp="${esc(x.t.explanation)}">${m[0]}</button>` + h.slice(m.index + m[0].length);
        done.add(x);
      }
      return h;
    };
  }
  function termClick(e) {
    const sheet = $("#term-sheet"); if (!sheet) return false;
    if (e.target.closest("#term-sheet .x")) { sheet.hidden = true; return true; }
    const b = e.target.closest(".term");
    if (!b) { if (!e.target.closest("#term-sheet")) sheet.hidden = true; return false; }
    sheet.innerHTML = `<div class="wrap"><button type="button" class="x" aria-label="Sluiten">×</button><h3>${esc(b.dataset.term)}</h3><p>${esc(b.dataset.exp)}</p><a href="#begrippen">Alle begrippen ›</a></div>`;
    sheet.hidden = false;
    termsSeen.add(b.dataset.term);
    document.querySelectorAll(".term.new").forEach((el) => { if (el.dataset.term.toLowerCase() === b.dataset.term.toLowerCase()) el.classList.remove("new"); });
    return true;
  }
  const termSheet = `<div class="term-sheet" id="term-sheet" role="dialog" aria-label="Uitleg begrip" hidden></div>`;
  function renderGlossary() {
    const g = state.feed.glossary || [];
    if (!g.length) return `<div class="empty"><h3>Nog geen begrippen</h3><p>Claude zet vanaf nu bij elk stuk de lastige begrippen, ook bij stukken die er al staan. In de tekst zijn ze onderstreept.</p></div>`;
    return `<input class="gl-filter" id="gl-q" type="search" placeholder="Zoek in ${g.length} begrippen" aria-label="Zoek een begrip">
      <dl class="gloss">${g.map((t) => `<div class="gl-item" data-k="${esc((t.term + " " + t.explanation).toLowerCase())}"><dt>${esc(t.term)}</dt><dd>${esc(t.explanation)}
        <span class="gl-refs">Uit: ${t.refs.map((r) => `<a href="#${r.kind}-${esc(r.id)}">${esc(r.title)}</a>`).join(" · ")}</span></dd></div>`).join("")}</dl>`;
  }

  /* ---- Jouw week ----
     Zondag schrijft Claude data/weekly.json (pipeline/weekly.py): de 3 belangrijkste ontwikkelingen.
     De app zet erbij wat alleen op dit toestel staat (laatste 7 dagen): verdiepingen en of je ze las,
     je controlevragen, herhalingen, het Claude-examen (Leren) en wat je las en beoordeelde. */
  const WEEK_BAR_DAYS = 3;
  function isoWeekRange(week) {
    const [y, w] = week.split("-W").map(Number);
    const jan4 = new Date(Date.UTC(y, 0, 4)), mon = new Date(jan4);
    mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    const f = (d) => d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", timeZone: "UTC" });
    return `${f(mon)} – ${f(sun)}`;
  }
  function weekBar() {
    const w = state.feed.weekly;
    if (!w || Date.now() - Date.parse(w.generated_at) > WEEK_BAR_DAYS * 864e5) return "";
    return `<a class="fb-send" href="#week"><span>Jouw week ${esc(w.week.split("-W")[1].replace(/^0/, ""))} staat klaar</span><b>Bekijken ›</b></a>`;
  }
  function lerenWeek(since) {
    try {
      const st = JSON.parse(localStorage.getItem("cca-academy-v2") || "null");
      if (!st?.certs) return null;
      let practised = 0, mastered = 0;
      Object.values(st.certs).forEach((c) => Object.values(c.q || {}).forEach((x) => {
        if (x.last >= since) practised++;
        if (x.b >= 2) mastered++;
      }));
      return { practised, mastered };
    } catch { return null; }
  }
  function renderWeek() {
    const w = state.feed.weekly, since = Date.now() - 7 * 864e5;
    const read = new Set(reads.since(0));
    const hl = w.highlights.map((h) => `<li><h3>${esc(h.title)}</h3><p>${esc(h.why)}</p>
      ${h.article_ids.length ? `<div class="wk-links">${h.article_ids.map((id) => state.byId.get(id)).filter(Boolean)
        .map((a) => `<a href="#a-${esc(a.id)}">${esc(a.headline || a.title)}${read.has("a-" + a.id) ? " ✓" : ""}</a>`).join("")}</div>` : ""}</li>`).join("");
    const dds = (state.feed.deepdives || []).filter((d) => Date.parse(d.written_at) >= since);
    const qs = Object.values(quiz.all()).filter((v) => Date.parse(v.at) >= since);
    const qOk = qs.filter((v) => v.ok).length, due = quiz.due().filter(qLookup).length;
    const lr = lerenWeek(since);
    const readN = reads.since(since).filter((k) => k.startsWith("a-")).length;
    const votesN = Object.values(fb.all()).filter((v) => Date.parse(v.at) >= since).length;
    const stats = [
      dds.length ? `<li>Verdiepingen: <b>${dds.filter((d) => read.has("v-" + d.id)).length} van ${dds.length}</b> gelezen${dds.filter((d) => !read.has("v-" + d.id)).map((d) => `<br><a href="#v-${esc(d.id)}">${esc(d.headline)}</a>`).join("")}</li>` : "",
      qs.length ? `<li>Controlevragen: <b>${qOk} van ${qs.length}</b> goed</li>` : `<li>Controlevragen: nog geen beantwoord deze week</li>`,
      due ? `<li><a href="#herhaling">${plural(due, "vraag", "vragen")} om te herhalen ›</a></li>` : "",
      lr ? `<li>Claude-examen: <b>${lr.practised}</b> vragen geoefend, <b>${lr.mastered}</b> beheerst in totaal</li>` : "",
      `<li>Gelezen: <b>${plural(readN, "artikel", "artikelen")}</b>${votesN ? `, ${plural(votesN, "duimpje", "duimpjes")} gegeven` : ""}</li>`,
    ].join("");
    openReader(`<div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">${esc(isoWeekRange(w.week))}</span></div></div>
      <article class="full wrap"><h1>Jouw week ${esc(w.week.split("-W")[1].replace(/^0/, ""))}</h1>
      <p class="lead">${esc(w.intro)}</p>
      <section class="block"><h2>Wat er echt toe deed</h2><ol class="wk-list">${hl}</ol></section>
      ${w.focus ? `<section class="try"><h2>Deze week proberen</h2><p>${esc(w.focus)}</p></section>` : ""}
      <section class="block"><h2>Jouw leerweek</h2><ul class="wk-stats">${stats}</ul>${fbSendBar(true)}</section>
      </article>`);
  }

  /* ---- Verdieping ---- */
  function renderDeepdive(d) {
    const mark = termMarker(d.terms);
    const topics = (d.topics || []).map((t) => state.feed.topics[t]?.name).filter(Boolean);
    const reading = (d.further_reading || []).map((r) => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>${r.note ? `<span class="why">${esc(r.note)}</span>` : ""}</li>`).join("");
    const html = `
      <div class="bar"><div class="wrap">
        <button class="icon-btn" type="button" id="back" aria-label="Terug naar de lijst"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
        <span class="crumb"></span>
      </div></div>
      <article class="full wrap dd">
        <div class="meta top"><span class="pill verdieping">verdieping</span><span>${d.reading_minutes} min lezen</span>${topics.length ? `<span>${esc(topics.join(" · "))}</span>` : ""}</div>
        <h1>${esc(d.headline)}</h1>
        <p class="lead">${mark(d.summary)}</p>
        ${(d.sections || []).map((s) => `<section class="dd-sec"><h2>${esc(s.heading)}</h2><div class="story">${s.paragraphs.map((p) => `<p>${mark(p)}</p>`).join("")}</div></section>`).join("")}
        ${showcaseBlock(d.showcase)}
        ${d.experiment ? `<section class="try"><h2>Probeer dit</h2><p>${esc(d.experiment)}</p></section>` : ""}
        ${d.limitations?.length ? `<section class="block"><h2>Let op</h2><ul>${d.limitations.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></section>` : ""}
        ${quizBlock(d)}
        <div class="read-end" aria-hidden="true"></div>
        ${askBlock("verdieping")}
        ${reading ? `<section class="block"><h2>Verder lezen</h2><ul class="reading">${reading}</ul></section>` : ""}
        <section class="block"><h2>Bron</h2><div class="source"><dl>
          <dt>Geschreven op</dt><dd>${esc(fmtDate(d.written_at))}</dd>
          <dt>Actualiteit</dt><dd>${esc(d.currency_check)}</dd>
        </dl></div></section>
      </article>`;
    openReader(html);
    trackRead("v-" + d.id);
  }

  /* ---- Artikel ---- */
  function block(title, kind, text) {
    if (!text) return "";
    const kinds = { bron: "Uit de bron", uitleg: "Uitleg", idee: "Idee" };
    return `<section class="block"><h2>${esc(title)}${kind ? ` <span class="kind ${kind}">${kinds[kind]}</span>` : ""}</h2><p>${esc(text)}</p></section>`;
  }
  /* ---- Zien en doen ----
     showcase: klein stukje echte code met resultaat ("Zo ziet het eruit").
     */
  function resultTable(cols, rows) {
    return `<div class="res-wrap"><table class="res"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v === null ? "NULL" : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function showcaseBlock(sc) {
    if (!sc?.code) return "";
    return `<section class="block show"><h2>Zo ziet het eruit</h2>
      <p class="show-cap">${esc(sc.caption)}</p>
      <pre class="code" data-lang="${esc(sc.language || "")}"><code>${esc(sc.code)}</code></pre>
      ${sc.result?.columns ? `<p class="show-arrow">Resultaat</p>${resultTable(sc.result.columns, sc.result.rows)}` : ""}
      ${sc.note ? `<p class="fb-note">${esc(sc.note)}</p>` : ""}</section>`;
  }


  /* ---- Vraag het Claude ----
     Opent claude.ai (of de Claude-app) met een ingevuld bericht: kern van het stuk, bronlink,
     korte context over de stack, en jouw vraag. claude.ai/new?q= vult de vraag in; de URL blijft
     kort genoeg (< ~6000 tekens) door de uitleg in te korten. Geen sleutels in de app. */
  const ASK_ME = "Over mij: analytics engineer bij een zorgorganisatie. Stack: Azure Databricks (Unity Catalog), dbt, Azure DevOps, Power BI. Externe AI gebruik ik nooit met werk- of patiëntdata.";
  const ASK_CHIPS = ["Leg dit eenvoudiger uit", "Hoe pas ik dit toe in mijn stack?", "Wat zijn de risico's of nadelen?", "Geef een concreet voorbeeld"];
  function askPrompt(ctx, question) {
    const head = `Ik lees in mijn Data & AI Radar ${ctx.kind} en heb een vraag.\n\n${ctx.kind === "dit artikel" ? "Artikel" : "Verdieping"}: ${ctx.title}${ctx.meta ? ` (${ctx.meta})` : ""}${ctx.url ? `\nBron: ${ctx.url}` : ""}\nSamenvatting: ${ctx.summary || ""}`;
    const tail = `\n\n${ASK_ME}\n\nMijn vraag: ${question}\n\nAntwoord in eenvoudig Nederlands, kort en concreet.${ctx.url ? " Lees zo nodig de bron." : ""}`;
    let body = ctx.body || "";
    const room = 1800 - head.length - tail.length;   // 1800 tekens ≈ 6000 na URL-codering
    if (body.length > room) body = room > 200 ? body.slice(0, room).replace(/\s+\S*$/, "") + " …" : "";
    return head + (body ? `\nUitleg uit de radar: ${body}` : "") + tail;
  }
  const askUrl = (ctx, q) => `https://claude.ai/new?q=${encodeURIComponent(askPrompt(ctx, q))}`;
  function askBlock(kind) {
    return `<section class="block ask" id="ask" data-kind="${kind}"><h2>Vraag het Claude</h2>
      <div class="ask-chips">${ASK_CHIPS.map((c) => `<button type="button" data-ask="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <form class="ask-form" id="ask-form"><textarea id="ask-q" rows="2" placeholder="Of stel je eigen vraag…" aria-label="Je vraag over dit stuk"></textarea>
      <button class="btn" type="submit">Vraag Claude ↗</button></form>
      <p class="fb-note">Opent een nieuw gesprek in Claude met de kern van dit stuk erbij.</p></section>`;
  }
  function askContext() {
    const h = location.hash.slice(1);
    if (h.startsWith("a-")) {
      const a = state.byId.get(h.slice(2)); if (!a) return null;
      return { kind: "dit artikel", title: a.headline || a.title, meta: `${source(a.source_id).name}, ${fmtDate(a.published_at)}`, url: a.url,
        summary: a.summary, body: (a.story || [a.simple_explanation, a.personal_relevance].filter(Boolean)).join(" ") };
    }
    if (h.startsWith("v-")) {
      const d = state.ddById.get(h.slice(2)); if (!d) return null;
      return { kind: "deze verdieping", title: d.headline, meta: `geschreven ${fmtDate(d.written_at)}`, url: "",
        summary: d.summary, body: (d.sections || []).map((x) => `${x.heading}: ${x.paragraphs.join(" ")}`).join(" ") };
    }
    return null;
  }
  function askOpen(q) {
    const ctx = askContext(); if (!ctx || !q.trim()) return;
    window.open(askUrl(ctx, q.trim()), "_blank", "noopener");
  }
  function askClick(e) {
    const chip = e.target.closest("[data-ask]");
    if (chip) askOpen(chip.dataset.ask);
  }

  function fbBlock(a) {
    const mine = fb.get(a.id);
    const reasons = mine ? (mine.v === 1 ? FB_UP : FB_DOWN) : null;
    return `<h2>Wat vond je hiervan?</h2>
      <div class="fb-btns">
        <button type="button" data-vote="1" aria-pressed="${mine?.v === 1}">👍 Nuttig</button>
        <button type="button" data-vote="-1" aria-pressed="${mine?.v === -1}">👎 Niet voor mij</button>
      </div>
      ${reasons ? `<div class="fb-reasons">${Object.entries(reasons).map(([k, l]) => `<button type="button" data-reason="${k}" aria-pressed="${mine.r === k}">${l}</button>`).join("")}</div>
      <p class="fb-note">${mine.v === -1 ? "Dit artikel verdwijnt uit je lijst. " : ""}${mine.sent ? "Verstuurd." : "Wordt meegestuurd met je volgende feedback (knop bovenaan Actueel)."}</p>` : ""}`;
  }
  function fbClick(e) {
    const box = e.target.closest("#fb"); if (!box) return;
    const id = box.dataset.id, a = state.byId.get(id), cur = fb.get(id);
    const vb = e.target.closest("[data-vote]"), rb = e.target.closest("[data-reason]");
    if (vb) {
      const v = Number(vb.dataset.vote);
      fb.set(id, cur?.v === v ? null : { v, r: null, title: a?.headline || a?.title || "", at: new Date().toISOString(), sent: false });
    } else if (rb && cur) {
      fb.set(id, { ...cur, r: cur.r === rb.dataset.reason ? null : rb.dataset.reason, sent: false });
    } else return;
    box.innerHTML = fbBlock(a || { id });
  }
  const READ_MIN_SEND = 5;   // alleen gelezen (zonder duimpjes)? Pas vanaf 5 de knop tonen
  const plural = (n, one, more) => `${n} ${n === 1 ? one : more}`;
  function fbSummary(items, rd) {
    return [items.length ? plural(items.length, "beoordeling", "beoordelingen") : "", rd.length ? `${rd.length} gelezen` : ""].filter(Boolean).join(", ");
  }
  function fbIssueUrl(items, rd = []) {
    const label = (v) => (v.v === 1 ? "👍" : "👎") + (v.r ? ` (${(FB_UP[v.r] || FB_DOWN[v.r] || v.r).toLowerCase()})` : "");
    const lines = items.map(([id, v]) => `- ${label(v)} ${v.title || id}`)
      .concat(rd.length ? [`- 📖 ${plural(rd.length, "artikel", "artikelen")} helemaal gelezen`] : []).join("\n");
    const block = JSON.stringify({ votes: items.map(([id, v]) => ({ id, v: v.v, r: v.r || null })), reads: rd });
    const body = `Beoordelingen uit de Data & AI Radar. GitHub Actions verwerkt dit automatisch en sluit het issue.\n\n${lines}\n\n\`\`\`json\n${block}\n\`\`\``;
    const title = `Feedback: ${fbSummary(items, rd)}`;
    return `https://github.com/${repo()}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  function fbSendBar(always) {
    const items = fb.pending(), rd = reads.pendingArticles().filter((id) => !fb.get(id));
    if (!items.length && (rd.length < (always ? 1 : READ_MIN_SEND))) return "";
    return `<a class="fb-send" id="fb-send" href="${esc(fbIssueUrl(items, rd))}" target="_blank" rel="noopener"><span>${esc(fbSummary(items, rd))} klaar om te versturen</span><b>Versturen ›</b></a>`;
  }
  function markSent() {
    const d = fb.all(); Object.values(d).forEach((v) => { v.sent = true; }); fb.save(d);
    const r = reads.all(); Object.entries(r).forEach(([k, v]) => { if (k.startsWith("a-")) v.sent = true; }); reads.save(r);
  }

  function renderArticle(a) {
    const mark = termMarker(a.terms);
    const s = source(a.source_id);
    const enriched = a.processing_status === "enriched";
    const parts = a.score_parts || {};
    const partRows = [["Past bij je onderwerpen", parts.topic, "55%"], ["Inhoudelijke kwaliteit", parts.quality, "20%"], ["Actualiteit", parts.recency, "15%"], ["Bron", parts.source, "10%"]]
      .map(([l, v, w]) => `<tr><td>${l} <span style="color:var(--muted)">(${w})</span></td><td><span class="meter"><span style="width:${Math.round((v || 0) * 100)}%"></span></span>${(v ?? 0).toFixed(2)}</td></tr>`).join("")
      + (parts.feedback ? `<tr><td>Jouw feedback <span style="color:var(--muted)">(max. ±8)</span></td><td>${parts.feedback > 0 ? "+" : ""}${Math.round(parts.feedback * 8)} punten</td></tr>` : "");
    // In de app sinds = wanneer Claude het uitlegde, anders wanneer het werd opgehaald (zelfde als sorteren op Nieuw).
    const added = a.processed_at || a.fetched_at;
    const inApp = added ? fmtDate(added) : "onbekend";
    const html = `
      <div class="bar"><div class="wrap">
        <button class="icon-btn" type="button" id="back" aria-label="Terug naar de feed"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
        <span class="crumb"></span>
        <a class="btn ghost" style="height:36px;padding:0 12px;font-size:.84rem" href="${esc(a.url)}" target="_blank" rel="noopener">Origineel ↗</a>
      </div></div>
      <article class="full wrap">
        <div class="meta top"><span class="src">${esc(s.name)}</span><button type="button" class="score-btn" id="score-btn" aria-haspopup="dialog" aria-label="Relevantie ${a.relevance_score} van 100, toon uitleg">${bars(a.relevance_score)}<span class="info" aria-hidden="true">i</span></button></div>
        ${a.format_version === 2 ? `
        <h1>${esc(a.headline)}</h1>
        <p class="orig">Origineel: ${esc(a.title)}</p>
        ${a.article_type === "opinie" && a.author ? `<div class="note" style="margin-top:14px">Dit is een mening van ${esc(a.author)}.</div>` : ""}
        ${a.date_note ? `<div class="note" style="margin-top:14px">${esc(a.date_note)}</div>` : ""}
        <div class="story">${(a.story || []).map((p) => `<p>${mark(p)}</p>`).join("")}</div>
        ${showcaseBlock(a.showcase)}
        ${a.experiment ? `<section class="try"><h2>Probeer dit</h2><p>${esc(a.experiment)}</p></section>` : ""}
        ${a.limitations?.length ? `<section class="block"><h2>Let op</h2><ul>${a.limitations.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></section>` : ""}
        ` : `
        <h1>${esc(a.title)}</h1>
        ${enriched ? `<p class="lead">${esc(a.summary)}</p>` : `<div class="callout"><p style="margin:0">Claude heeft dit artikel nog niet uitgelegd. Dat gebeurt meestal de volgende ochtend.${a.excerpt ? ` Korte beschrijving (Engels): <em>${esc(a.excerpt)}</em>` : ""}</p></div>`}
        ${a.date_note ? `<div class="note" style="margin-top:14px">${esc(a.date_note)}</div>` : ""}
        ${block("Wat is er nieuw?", "bron", a.what_is_new)}
        ${block("Eenvoudig uitgelegd", "uitleg", a.simple_explanation)}
        ${block("Een voorbeeld", "uitleg", a.practical_example)}
        ${block("Waarom is dit relevant voor jou?", "uitleg", a.personal_relevance)}
        ${block("Wat kun je ermee?", "idee", a.practical_application)}
        ${block("Probeer dit", "idee", a.experiment)}
        ${a.limitations?.length ? `<section class="block"><h2>Beperkingen en aandachtspunten</h2><ul>${a.limitations.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></section>` : ""}
        `}
        <section class="block fb" id="fb" data-id="${esc(a.id)}">${fbBlock(a)}</section>
        <div class="read-end" aria-hidden="true"></div>
        ${askBlock("artikel")}
        <section class="block"><h2>Bron</h2><div class="source"><dl>
          <dt>Gepubliceerd</dt><dd>${esc(a.published_at ? fmtDate(a.published_at) : "Onbekend: de bron gaf geen betrouwbare datum")}</dd>
          <dt>In de app sinds</dt><dd>${esc(inApp)}</dd>
        </dl></div></section>
        <dialog class="score-dlg" id="score-dlg" aria-labelledby="score-dlg-h">
          <h2 id="score-dlg-h">Waarom deze score?</h2>
          <table class="score-table">${partRows}</table>
          <p class="score-note">Berekend met de prioriteiten uit interests.yml. Totaal ${a.relevance_score} van 100${a.decision === "included_exceptional" ? "; getoond via de uitzonderingsregel" : ""}.</p>
          <form method="dialog"><button class="btn ghost" type="submit">Sluiten</button></form>
        </dialog>
      </article>`;
    openReader(html);
    trackRead("a-" + a.id);
  }

  /* ---- Feedcontrole ---- */
  function fbLearned() {
    const f = state.feed.feedback;
    if (!f?.votes && !f?.reads) return `<section class="block"><h2>Wat de radar van je feedback leerde</h2><p style="font-size:.92rem">Nog geen duimpjes verwerkt. Geef onderaan een artikel een 👍 of 👎 en verstuur ze vanaf Actueel.</p></section>`;
    const row = (name, v) => `<li>${v > 0 ? "▲" : "▼"} ${esc(name)} <span style="color:var(--muted)">(${v > 0 ? "+" : ""}${Math.round(v * 8)} punten)</span></li>`;
    const topics = Object.entries(f.topics || {}).sort((a, b) => b[1] - a[1]).map(([t, v]) => row(state.feed.topics[t]?.name || t, v));
    const srcs = Object.entries(f.sources || {}).sort((a, b) => b[1] - a[1]).map(([sid, v]) => row(source(sid).name, v));
    return `<section class="block"><h2>Wat de radar van je feedback leerde</h2>
      <p style="font-size:.92rem">${f.votes || 0} beoordeling${f.votes === 1 ? "" : "en"}${f.reads ? ` en ${f.reads} gelezen artikel${f.reads === 1 ? "" : "en"}` : ""} verwerkt${f.updated_at ? `, laatst op ${esc(fmtDateTime(f.updated_at))}` : ""}. Artikelen over deze onderwerpen en bronnen schuiven zoveel punten omhoog of omlaag.</p>
      ${topics.length ? `<h3 style="font-size:.9rem;margin:10px 0 4px">Onderwerpen</h3><ul>${topics.join("")}</ul>` : ""}
      ${srcs.length ? `<h3 style="font-size:.9rem;margin:10px 0 4px">Bronnen</h3><ul>${srcs.join("")}</ul>` : ""}
    </section>`;
  }
  function renderReport() {
    const f = state.feed, q = f.quality_report || {};
    const enr = q.enrichment || {};
    const srcRows = f.sources.map((s) => `<tr><td><strong>${esc(s.name)}</strong><br><span style="color:var(--muted)">${esc(TYPE_LABEL[s.type] || s.type)} · ${esc(s.fetch_method)}</span></td><td><span class="st ${esc(s.status)}">${esc(SRC_STATUS[s.status] || s.status)}</span></td><td style="font-variant-numeric:tabular-nums">${s.items ?? 0}</td><td>${esc(s.message || "")}</td></tr>`).join("");
    const dec = { included: "getoond", included_exceptional: "getoond (uitzondering)", below_threshold: "onder de drempel", no_topic: "geen passend onderwerp", excluded: "uitgesloten onderwerp", hidden_by_feedback: "duim omlaag", source_cap: "maximum per bron" };
    const hidden = (q.not_shown || []).map((x) => `<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><br><span style="color:var(--muted)">${esc(source(x.source_id).name)}</span></td><td>${esc(dec[x.decision] || x.decision)}${x.excluded_by?.length ? ` (${esc(x.excluded_by.join(", "))})` : ""}</td><td style="font-variant-numeric:tabular-nums">${x.relevance_score}</td></tr>`).join("");
    const flags = (q.date_flags || []).map((d) => `<li><strong>${esc(source(d.source_id).name)}:</strong> ${esc(d.message)}</li>`).join("");
    const noSrc = (q.topics_without_source || []).map((t) => f.topics[t]?.name || t);
    const perGroup = Object.entries(q.per_group || {}).map(([g, n]) => `${esc(groupLabel(g))}: ${n}`).join(" · ");
    openReader(`
      <div class="bar"><div class="wrap"><button class="icon-btn" type="button" id="back" aria-label="Terug naar de feed"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg></button><span class="crumb">Feedcontrole</span></div></div>
      <div class="wrap report" style="padding-block:18px 60px">
        <h1>Feedcontrole</h1>
        <p style="color:var(--muted)">Hier zie je of de feed goede, actuele artikelen oplevert: welke bronnen werken, wat er is weggefilterd en waarom.</p>
        <div class="status" style="margin:12px 0"><span class="dot" style="background:${(MODE[f.mode] || MODE.partial).color}"></span><span><strong>${esc((MODE[f.mode] || {}).label || f.mode)}</strong><br>${esc(f.mode_note || "")}</span></div>
        <div class="stats">
          <div class="stat"><b>${q.fetched_items ?? 0}</b><span>opgehaald</span></div>
          <div class="stat"><b>${q.merged_duplicates ?? 0}</b><span>dubbel samengevoegd</span></div>
          <div class="stat"><b>${q.shown ?? 0}</b><span>in de feed (drempel ${q.threshold ?? "?"})</span></div>
          <div class="stat"><b>${q.processing?.enriched ?? 0}</b><span>uitgelegd door AI</span></div>
          <div class="stat"><b>${q.without_date ?? 0}</b><span>zonder publicatiedatum</span></div>
        </div>
        ${fbLearned()}
        <section class="block"><h2>Verdeling over onderwerpen</h2><p style="font-size:.92rem">${perGroup || "–"}</p></section>
        ${noSrc.length ? `<section class="block"><h2>Onderwerpen zonder bron</h2><p style="font-size:.92rem">${esc(noSrc.join(", "))}. Hierover kan de feed alleen toevallig iets vinden.</p></section>` : ""}
        ${flags ? `<section class="block"><h2>Datums om te controleren</h2><ul>${flags}</ul></section>` : ""}
        <section class="block"><h2>AI-verwerking</h2><p style="font-size:.92rem">${enr.api_key_present ? `${enr.processed} nieuwe artikelen verwerkt${enr.failed?.length ? `, ${enr.failed.length} mislukt` : ""}.` : `Geen API-sleutel ingesteld: ${enr.skipped_no_key ?? 0} artikelen bleven onverwerkt. Bestaande uitleg wordt hergebruikt.`}</p></section>
        <section class="block"><h2>Bronnen</h2><div class="tbl"><table><thead><tr><th>Bron</th><th>Status</th><th>Items</th><th>Toelichting</th></tr></thead><tbody>${srcRows}</tbody></table></div></section>
        <section class="block"><h2>Niet getoond</h2><div class="tbl"><table><thead><tr><th>Artikel</th><th>Reden</th><th>Score</th></tr></thead><tbody>${hidden || `<tr><td colspan="3">Niets weggefilterd.</td></tr>`}</tbody></table></div></section>
      </div>`);
  }

  /* ---- Navigatie (#a-<id> en #feedcontrole) ---- */
  function openReader(html) {
    const r = $("#reader");
    const wasHidden = r.hidden;
    if (wasHidden) state.scrollY = window.scrollY;
    r.innerHTML = html;
    r.hidden = false;
    r.scrollTop = 0;
    document.body.style.overflow = "hidden";
    $("#back", r).onclick = () => { history.length > 1 && state.cameFromList ? history.back() : (location.hash = ""); };
    $("#back", r).focus({ preventScroll: true });
    if (r.querySelector("article.full") && !r.querySelector("#term-sheet")) r.insertAdjacentHTML("beforeend", termSheet);
    r.onclick = (e) => {
      if (termClick(e)) return;
      if (e.target.closest("#fb-send")) { markSent(); setTimeout(() => { if (location.hash === "#week") renderWeek(); }, 300); return; }
      fbClick(e); quizClick(e); askClick(e);
    };
    const af = $("#ask-form", r);
    if (af) af.onsubmit = (e) => { e.preventDefault(); askOpen($("#ask-q", r).value); };
    const dlg = $("#score-dlg", r), btn = $("#score-btn", r);
    if (dlg && btn) {
      btn.onclick = () => dlg.showModal();
      dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    }
  }
  function closeReader() {
    const r = $("#reader");
    if (r.hidden) return;
    r.hidden = true; r.innerHTML = "";
    document.body.style.overflow = "";
    window.scrollTo(0, state.scrollY);
  }
  function route() {
    if (!state.feed) return;
    const h = location.hash.slice(1);
    if (h.startsWith("a-") && state.byId.has(h.slice(2))) { renderArticle(state.byId.get(h.slice(2))); return; }
    if (h === "herhaling") { renderReview(); return; }
    if (h === "begrippen") {
      state.view = "verdieping"; state.ddTab = "begrippen"; store.set("view", state.view); store.set("ddTab", state.ddTab);
      renderSeg(); closeReader(); renderList(); window.scrollTo(0, 0); return;
    }
    if (h === "week" && state.feed.weekly) { renderWeek(); return; }
    if (h.startsWith("v-") && state.ddById.has(h.slice(2))) { renderDeepdive(state.ddById.get(h.slice(2))); return; }
    if (h === "feedcontrole") { renderReport(); return; }
    closeReader();
    renderList();
  }

  /* ---- Events ---- */
  window.addEventListener("hashchange", route);
  $("#content").addEventListener("click", (e) => {
    if (!e.target.closest("#fb-send")) return;
    markSent();
    setTimeout(renderList, 300);
  }, true);
  const openCard = (el) => { state.cameFromList = true; location.hash = el.dataset.dd ? "v-" + el.dataset.dd : "a-" + el.dataset.id; };
  $("#content").addEventListener("click", (e) => { const el = e.target.closest("[data-id],[data-dd]"); if (el) openCard(el); });
  $("#content").addEventListener("input", (e) => {
    if (e.target.id !== "gl-q") return;
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".gl-item").forEach((el) => { el.hidden = !!q && !el.dataset.k.includes(q); });
  });
  $("#content").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".card")) { e.preventDefault(); openCard(e.target); } });
  $("#seg-view").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.v; store.set("view", state.view); renderSeg(); renderList(); window.scrollTo(0, 0); });
  $("#seg-dd").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.ddTab = b.dataset.v; store.set("ddTab", state.ddTab); renderSeg(); renderList(); window.scrollTo(0, 0); });
  $("#seg-sort").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.sort = b.dataset.v; store.set("sort", state.sort); renderSeg(); renderList(); });
  $("#btn-report").addEventListener("click", () => { state.cameFromList = true; location.hash = "feedcontrole"; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#reader").hidden && !document.querySelector("dialog[open]")) location.hash = ""; });

  load();
})();
</script>
