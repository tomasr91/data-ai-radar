# Zoekt en controleert feeds voor bronnen die nog geen feed hebben.
# Handmatig starten via Actions -> Feeds zoeken -> Run workflow.
# Past sources.yml niet aan; het resultaat staat in data/feed_discovery.json.

name: Feeds zoeken

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Feeds zoeken en controleren
        run: python scripts/discover_feeds.py
      - name: Resultaat opslaan
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/feed_discovery.json
          git diff --cached --quiet || (git commit -m "Feedonderzoek $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
