# Data & AI Radar — nieuwsbronnen
# verification.status:
#   verified       = adres zelf teruggevonden in een officiële of betrouwbare vermelding
#   user_supplied  = door mij opgegeven, (nog) niet onafhankelijk teruggevonden; mag aan staan
#   to_verify      = placeholder; staat uit tot het adres is bevestigd

schema_version: 2
updated: "2026-10-28"

definitions:
  type:
    official_docs: Officiële productdocumentatie en release notes (primaire bron voor productwijzigingen)
    vendor_blog: Blog of engineeringblog van een leverancier
    expert_blog: Vakmensen — duiding, praktijkervaring en ideeën
    technical_article: Technische artikelen en tutorials
    independent_news: Onafhankelijke nieuwsbronnen, nieuwsbrieven en technologie-radars (extra context)
  trust_level:
    high: Primaire bron of bewezen betrouwbaar; feiten mogen zonder tweede bron worden overgenomen
    medium: Betrouwbaar, maar interpretatie of commercieel belang; claims over productfuncties checken bij de primaire bron
    low: Alleen als signaal; nooit als enige bron voor een feit
  priority:
    description: >-
      Hoe zwaar een bron meetelt bij de selectie (1-5). Staat los van trust_level:
      een expertblog kan hoge prioriteit hebben, maar productclaims blijven te checken
      bij een officiële bron. De onderwerp-prioriteit uit interests.yml blijft leidend.
  fetch_method:
    rss: RSS-feed uitlezen (feed_url)
    atom: Atom-feed uitlezen (feed_url)
    html: Pagina ophalen en nieuwe items herkennen
    github_releases: Releases van een GitHub-repository volgen
    manual: Handmatig toevoegen, niet automatisch ophalen
  verification_status:
    verified: Adres zelf teruggevonden op checked_on
    user_supplied: Door mij opgegeven; nog niet onafhankelijk teruggevonden
    to_verify: Placeholder; niet gebruiken voordat het is bevestigd

