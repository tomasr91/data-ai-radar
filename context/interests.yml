# Data & AI Radar — interesses
# Pas prioriteiten, onderwerpen en zoektermen hier aan; er is geen codewijziging nodig.
# Prioriteit = hoe zwaar een onderwerp meetelt bij de selectie, niet hoe belangrijk het in het algemeen is.

schema_version: 1
updated: "2026-10-29"

priority_levels:
  5:
    label: kernonderwerp
    description: Direct relevant voor mijn dagelijkse werk en projecten
    target_share: [0.30, 0.35]
  4:
    label: zeer relevant
    description: Belangrijke technische ontwikkelingen die ik actief wil volgen
    target_share: [0.25, 0.30]
  3:
    label: interessant
    description: Nuttige verbreding of mogelijke toepassing
    target_share: [0.20, 0.25]
  2:
    label: verkennend
    description: Af en toe interessant, maar geen hoofdonderwerp
    target_share: [0.05, 0.15]
  1:
    label: alleen uitzonderlijk
    description: Alleen tonen bij uitzonderlijk relevante ontwikkelingen
    target_share: [0.00, 0.05]

# Startwaarden voor de selectie; vrij aan te passen.
scoring:
  target_share_is_guideline: true      # richtwaarden, geen harde quota
  related_topic_weight: 0.5            # een gerelateerd onderwerp telt voor de helft mee
  min_relevance_score: 0.6             # onder deze drempel geen plek in de feed, ook niet bij prioriteit 5 (0.5 liet ook losse productvermeldingen door)
  max_items_per_topic_per_feed: 3      # houdt de feed gevarieerd
  other_factors: [recency, trust_level, novelty, diversity]
  exceptional_override:
    enabled: true
    applies_to_priorities: [1, 2]
    rule: >-
      Een artikel mag de feed in, ook bij prioriteit 1 of 2, als het een grote,
      bevestigde wijziging is in een tool uit tech-stack.md of directe gevolgen
      heeft voor een project in projects.md. De reden wordt bij het artikel vermeld.

# Richtverdeling over de vier interessegebieden (uit mijn profiel van 29-10-2026).
# Flexibele richtwaarden, geen quota. Een artikel kan meerdere onderwerpen raken, maar
# verschijnt maar één keer in de feed.
interest_areas:
  - id: data_engineering
    label: dbt, data engineering en data-architectuur
    target_share: 0.30
    topics: [dbt_analytics_engineering, databricks_data_engineering, data_architecture_modeling, sql_spark_sql, cicd_data_deployment, data_quality_observability, metadata_lineage_catalogs, data_governance_privacy, powerbi_semantic_models]
  - id: context_agents
    label: Context engineering en AI-agents
    target_share: 0.30
    topics: [ai_context_engineering, ai_agents_rag, ai_on_data_platform, ai_evaluation_observability]
  - id: claude
    label: Claude en AI-ondersteunde ontwikkeling
    target_share: 0.20
    topics: [claude_ai_development]
  - id: new_tech
    label: Nieuwe technologieën en architectuurpatronen
    target_share: 0.20
    topics: [open_source_tools, general_ai_trends, ai_in_healthcare, ai_research_data]

# Filtergroepen in de app. Elk onderwerp hoort bij één groep (feed_group).
feed_groups:
  - {id: dbt, label: "dbt & analytics engineering"}
  - {id: databricks, label: "Databricks & data-engineering"}
  - {id: ai_context, label: "AI & context engineering"}
  - {id: architectuur, label: "Data-architectuur & modellering"}
  - {id: agents, label: "AI-agents & RAG"}
  - {id: claude, label: "Claude & AI-ondersteunde ontwikkeling"}
  - {id: kwaliteit, label: "Datakwaliteit & governance"}
  - {id: zorg, label: "AI in de zorg"}
  - {id: overig, label: "Overige relevante onderwerpen"}

# Harde uitsluitingen: artikelen die hier hoofdzakelijk over gaan komen nooit in de feed,
# ook niet via de uitzonderingsregel.
# keywords zoeken in de hele tekst; title_patterns zijn reguliere expressies op de titel
# (hoofdletterongevoelig).
excluded_topics:
  - id: funding_acquisitions
    name: Funding- en overnamenieuws
    # Geen losse woorden als "raises" of "acquisition": die staan ook in technische teksten
    # ("raises an error", "data acquisition").
    keywords: [funding round, raises funding, raised funding, Series A, Series B, Series C, announces acquisition, to acquire, acquires, valuation, IPO]
  - id: generative_media
    name: AI voor beeld, video en muziek
    keywords: [image generation, text-to-image, video generation, text-to-video, AI music, diffusion model art]
  - id: crypto_blockchain
    name: Crypto en blockchain
    keywords: [crypto, cryptocurrency, blockchain, web3, NFT, bitcoin]
  - id: connector_releases
    name: Nieuwe connectoren voor bronsystemen
    # bijv. "QuickBooks connector is available in Beta", "Box Audit Logs managed ingestion connector (Beta)".
    # Niet geraakt: drivers zoals "Databricks ADBC connector for Power BI".
    keywords: [managed ingestion connector, ingestion connector]
    title_patterns:
      - '\bconnector (is )?(now )?(available|generally available|in beta|in public preview)\b'
      - '\bconnector \((beta|public preview|preview|ga|generally available)\)'
  - id: minor_builds
    name: Dev-builds en patchreleases
    # Wel tonen: grote en kleine releases (dbt v2.0, v1.13) en bèta's (v1.13.0b1).
    # Niet tonen: patches (v1.12.6, v2.0.3) en dev- of testbuilds (v2.0.0-dev.41-test-pypi).
    title_patterns:
      - '^(dbt )?v?\d+\.\d+\.[1-9]\d*$'
      - '[-.]dev\.?\d|test-pypi|nightly'
  - id: mini_updates
    name: Kleine updates en verzameloverzichten
    # Maandoverzichten met veel kleine functies en uitrol naar extra regio's.
    title_patterns:
      - 'feature summary'
      - "what's new in .*(january|february|march|april|may|june|july|august|september|october|november|december)"
      - '\bnow processed in\b'
      - '\bavailable in (more|new|additional) regions\b'

topics:
  - id: dbt_analytics_engineering
    name: dbt en analytics engineering
    description: >-
      Modellering, transformaties, tests, contracts, documentatie en deployment met dbt.
      Extra aandacht voor dbt als kennisbron voor AI (metadata, docs, lineage), AI-agents
      die dbt-modellen onderzoeken of aanpassen, en open-sourceprojecten rond dbt.
    feed_group: dbt
    enabled: true
    priority: 5
    keywords: [dbt, dbt Core, dbt Fusion, dbt tests, data contracts, dbt semantic layer, analytics engineering, dbt-databricks, dbt v2, dbt 2.0, dbt MCP, dbt docs, dbt lineage, dbt artifacts, manifest.json, model contracts, stale data]
    related_topics: [data_architecture_modeling, cicd_data_deployment, data_quality_observability]

  - id: databricks_data_engineering
    name: Databricks en data engineering
    description: Het Databricks-platform, Spark, Delta Lake, pipelines en cloudontwikkeling.
    feed_group: databricks
    enabled: true
    priority: 5
    keywords: [Databricks, Delta Lake, Unity Catalog, Lakeflow, serverless compute, Databricks Asset Bundles, Spark, lakehouse]
    related_topics: [sql_spark_sql, ai_on_data_platform, metadata_lineage_catalogs]

  - id: ai_on_data_platform
    name: AI op het dataplatform
    description: AI toepassen op bestaande data en pipelines, binnen het eigen platform.
    feed_group: ai_context
    enabled: true
    priority: 5
    keywords: [AI functions, ai_query, model serving, LLM in SQL, AI-assisted data engineering, Databricks AI, dbt AI]
    related_topics: [ai_context_engineering, databricks_data_engineering, ai_agents_rag]

  - id: ai_context_engineering
    name: AI-context engineering
    description: >-
      De juiste informatie voor AI, op het juiste moment en in de juiste vorm. Kernonderwerp.
      Context uit repositories, code, documentatie en metadata; embeddings, chunking,
      retrieval en reranking; contextvensters en contextcompressie; knowledge graphs;
      actualiteit en kwaliteit van context. Extra aandacht: hoe een AI een groot
      dbt-project of dataplatform echt begrijpt. Liefst met concrete implementaties.
    feed_group: ai_context
    enabled: true
    priority: 5
    keywords: [context engineering, semantic layer, metadata for AI, MCP, Model Context Protocol, AI-ready data, knowledge graph, embeddings, chunking, reranking, context window, context compression, codebase context, repository context, GraphRAG, prompt engineering]
    related_topics: [ai_agents_rag, metadata_lineage_catalogs, ai_on_data_platform, claude_ai_development]

  - id: data_architecture_modeling
    name: Data-architectuur en datamodellering
    description: Ontwerp van betrouwbare, herbruikbare datamodellen en lagen.
    feed_group: architectuur
    enabled: true
    priority: 5
    keywords: [data architecture, data modeling, medallion architecture, dimensional modeling, data vault, lakehouse architecture, data mesh]
    related_topics: [dbt_analytics_engineering, databricks_data_engineering, powerbi_semantic_models]

  - id: ai_agents_rag
    name: AI-agents en RAG
    description: >-
      Agents die zelf informatie verzamelen, tools gebruiken en meerstapstaken uitvoeren.
      Agentarchitecturen, MCP, geheugen, foutafhandeling en menselijke goedkeuring, agents
      die SQL schrijven of datamodellen onderzoeken, plus beveiligingsrisico's en kosten.
      Voorkeur voor voorbeelden die laten zien welke taak de agent doet, welke informatie
      hij nodig heeft en hoe gecontroleerd wordt of het klopt.
    feed_group: agents
    enabled: true
    priority: 5
    keywords: [AI agents, agentic, RAG, retrieval augmented generation, vector search, tool use, tool calling, MCP server, multi-agent, agent memory, human in the loop, text-to-SQL, prompt injection]
    related_topics: [ai_context_engineering, ai_on_data_platform, ai_evaluation_observability, claude_ai_development]

  - id: ai_evaluation_observability
    name: Evaluatie en observability van AI
    description: Meten of een AI-systeem goed werkt; evals, tracing, monitoring en betrouwbaarheid.
    feed_group: agents
    enabled: true
    priority: 4
    keywords: [evals, LLM evaluation, agent evaluation, tracing, LLM observability, MLflow tracing, LLM as a judge, guardrails, hallucination]
    related_topics: [ai_agents_rag, data_quality_observability]

  - id: claude_ai_development
    name: Claude en AI-ondersteunde ontwikkeling
    description: >-
      Alleen Claude en het eigen ecosysteem; andere LLM-aanbieders zijn geen eigen
      interessegebied. Nieuwe Claude-modellen, Claude Code en agentic coding, skills,
      hooks, subagents en projectinstructies, werken met grote repositories, codereview en
      refactoring, en Claude praktisch inzetten bij dbt, data engineering en context
      engineering. Ook werkwijzen, niet alleen nieuwe functies.
    feed_group: claude
    enabled: true
    priority: 4
    keywords: [Claude, Claude Code, Anthropic, Claude Sonnet, Claude Opus, Claude Haiku, agentic coding, CLAUDE.md, subagents, Agent Skills, hooks, Claude Agent SDK]
    related_topics: [ai_agents_rag, ai_context_engineering, cicd_data_deployment]

  - id: data_quality_observability
    name: Datakwaliteit en observability
    description: Problemen eerder detecteren en de betrouwbaarheid van data verhogen.
    feed_group: kwaliteit
    enabled: true
    priority: 4
    keywords: [data quality, data observability, data tests, anomaly detection, data monitoring, freshness, Lakehouse Monitoring]
    related_topics: [dbt_analytics_engineering, metadata_lineage_catalogs]

  - id: metadata_lineage_catalogs
    name: Metadata, lineage en catalogi
    description: Data vindbaar en begrijpelijk maken voor mensen en AI.
    feed_group: kwaliteit
    enabled: true
    priority: 4
    keywords: [data catalog, data lineage, column lineage, metadata, Unity Catalog, data discovery, tagging]
    related_topics: [data_governance_privacy, ai_context_engineering, data_quality_observability]

  - id: cicd_data_deployment
    name: GitHub, CI/CD en data deployment
    description: Automatisering, versiebeheer en uitrol van dataoplossingen.
    feed_group: overig
    enabled: true
    priority: 4
    keywords: [Azure DevOps, Azure Pipelines, CI/CD, slim CI, DataOps, deployment, pull request review, infrastructure as code]
    related_topics: [dbt_analytics_engineering, databricks_data_engineering]

  - id: sql_spark_sql
    name: SQL en Spark SQL
    description: Praktische SQL voor transformaties en verwerking, inclusief dialectverschillen.
    feed_group: databricks
    enabled: true
    priority: 4
    keywords: [SQL, Spark SQL, T-SQL, SQL Server, query optimization, SQL dialect, window functions]
    related_topics: [databricks_data_engineering, dbt_analytics_engineering]

  - id: data_governance_privacy
    name: Data governance en privacy
    description: Verantwoord gebruik van data, met nadruk op privacy en toegang in de zorg.
    feed_group: kwaliteit
    enabled: true
    priority: 4
    keywords: [data governance, privacy, AVG, GDPR, access control, data classification, pseudonymization, EU AI Act]
    related_topics: [metadata_lineage_catalogs, ai_in_healthcare, ai_research_data]

  - id: ai_in_healthcare
    name: AI in de zorg
    description: Toepassingen en beperkingen van AI binnen een zorginstelling. Alleen bij uitzonderlijk relevant nieuws.
    feed_group: zorg
    enabled: true
    priority: 1
    keywords: [AI in healthcare, zorg AI, clinical AI, healthcare data platform, medical AI regulation, responsible AI healthcare]
    related_topics: [data_governance_privacy, ai_research_data]

  - id: ai_research_data
    name: AI en onderzoeksdata
    description: AI voor onderzoek en kennisontsluiting met onderzoeksdata. Alleen bij uitzonderlijk relevant nieuws.
    feed_group: zorg
    enabled: true
    priority: 1
    keywords: [research data, FAIR data, research data management, synthetic data, cohort selection, trusted research environment]
    related_topics: [ai_in_healthcare, data_governance_privacy, ai_agents_rag]

  - id: powerbi_semantic_models
    name: Power BI en semantische modellen
    description: >-
      Aansluiting op BI, rapportages en AI op bedrijfsdata. Alleen de must-knows: grote
      functies die algemeen beschikbaar worden, wijzigingen in de koppeling met Databricks,
      en functies die stoppen. Geen kleine updates of maandoverzichten.
    feed_group: overig
    enabled: true
    priority: 4
    keywords: [Power BI, semantic model, DAX, Copilot Power BI, Microsoft Fabric, metrics layer, Direct Lake, Power BI Databricks]
    related_topics: [data_architecture_modeling, ai_context_engineering]

  - id: open_source_tools
    name: Nieuwe open-sourceprojecten en tools
    description: >-
      Repositories en tools die iets nieuws toevoegen: context engineering, metadata en
      lineage, datakwaliteit, MCP en agents, retrieval en kennisrepresentatie,
      code-intelligentie, evaluatie, en slimme automatisering van data-engineering.
      Werkende code met een duidelijke toepassing weegt zwaarder dan een herverpakt concept.
    feed_group: overig
    enabled: true
    priority: 3
    keywords: [open source, open-source, GitHub repository, open-source tool, code intelligence, repository analysis, Hugging Face, LangChain, LlamaIndex, agent framework]
    related_topics: [ai_context_engineering, ai_agents_rag, metadata_lineage_catalogs]

  - id: general_ai_trends
    name: Algemene AI-trends en technologienieuws
    description: >-
      Hype en generiek nieuws vermijden; alleen uitzonderlijke ontwikkelingen. Nieuwe modellen
      van andere aanbieders dan Anthropic vallen hieronder.
    feed_group: overig
    enabled: true
    priority: 1
    keywords: [AI trends, AI industry, AI regulation news, tech news, new model release, LLM release, GPT, Gemini]
    related_topics: [claude_ai_development]
